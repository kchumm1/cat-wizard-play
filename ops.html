<script>
async function unlock(box, pass, keyB64) {
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var raw;
  if (keyB64) raw = b(keyB64);
  else {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b(box.salt), iterations: box.n, hash: 'SHA-256' }, base, 256));
  }
  var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(box.iv) }, key, b(box.data));
  var s = ''; for (var i = 0; i < raw.length; i++) s += String.fromCharCode(raw[i]);
  return { html: new TextDecoder().decode(plain), key: btoa(s) };
}
(function () {
  var K = 'cw-ops-unlock', box = JSON.parse(document.getElementById('box').textContent);
  var $ = function (id) { return document.getElementById(id); };
  function get() { try { return localStorage.getItem(K); } catch (e) { return null; } }
  function put(v) { try { if (v) localStorage.setItem(K, v); else localStorage.removeItem(K); } catch (e) { } }
  // the page is written over only once it has finished loading: a write while it is still loading is ignored
  function open(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') go(); else addEventListener('load', go, { once: true });
  }
  if (/[?&]lock\b/.test(location.search)) put(null);
  var kept = get();
  if (kept) unlock(box, null, kept).then(function (r) { open(r.html); }, function () { put(null); });
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pass = $('p').value; if (!pass) return;
    $('b').disabled = true; $('m').textContent = '여는 중…';
    unlock(box, pass).then(function (r) {
      if ($('r').checked) put(r.key);
      open(r.html);
    }, function () { $('b').disabled = false; $('m').textContent = '비밀번호가 맞지 않아요.'; $('p').select(); });
  });
})();
</script>
