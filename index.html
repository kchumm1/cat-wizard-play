<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>별빛 냥법사</title>

</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen portrait game — HUD over a 3D stage, skill bar, tabbed panel, tab bar. Single dark night-sky look. */
:root{
  --ink:#0f1019; --panel:#181a28; --panel-2:#22253a; --line:#2c2f47; --text:#f3f3f8; --muted:#a9abc3; --faint:#7d809e; --gold-ink:#3a2600; --tabh:64px; --sel:#ffffff; --sel-ink:#14151f; --sel-grad:linear-gradient(180deg,#ffffff,#e6e7ef);
  --gold-soft:#ffd76e; --gem-soft:#8fe4ff;
  --gold:#ffcf4a; --gem:#7fe3ff; --accent:#ff8fd0; --ok:#6fe08a; --bad:#ff6b7f;
  --g0:#a3a7ad; --g1:#4fc46a; --g2:#3d8bfd; --g3:#a259ff; --g4:#ff9f1c; --g5:#ff4d6d;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;background:var(--ink);user-select:none;-webkit-user-select:none;overflow:hidden}
/* the battle fills the whole phone; menus slide up over it */
#stage{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;left:0;top:0;font:400 19px var(--display);color:#fff;-webkit-text-stroke:4px #2a1030;paint-order:stroke fill;opacity:0;white-space:nowrap;will-change:transform}
.dmg.crit{color:var(--gold);font-size:26px}
.dmg small{display:block;font-size:.5em;line-height:1;text-align:center;letter-spacing:.02em}
.dmg.c2{color:#ff7a3a;font-size:31px;-webkit-text-stroke:5px #3a0a10;paint-order:stroke fill}
.dmg.c3{color:#d07bff;font-size:36px;-webkit-text-stroke:5px #20063a;paint-order:stroke fill}
.dmg.c4{font-size:42px;color:#8ff9ff;-webkit-text-stroke:6px #062a3a;paint-order:stroke fill;text-shadow:0 0 14px #ff7ae0,0 0 4px #fff}
.dmg.c4 small{color:#fff}
.dmg.c5{font-size:46px;color:#ff86c8;-webkit-text-stroke:6px #3a0622;paint-order:stroke fill;text-shadow:0 0 16px #ff4fa8,0 0 4px #fff}
.dmg.c6{font-size:50px;color:#fff;-webkit-text-stroke:6px #3a2a10;paint-order:stroke fill;text-shadow:0 0 18px #ffd84a,0 0 6px #fff}
.dmg.c7{font-size:54px;color:#a6ff8f;-webkit-text-stroke:7px #0a2a06;paint-order:stroke fill;text-shadow:0 0 22px #3aff5a,0 0 6px #fff}
.dmg.c5 small,.dmg.c6 small,.dmg.c7 small{color:#fff}
.screen-flash{position:absolute;inset:0;opacity:0}
.coin.fly{position:fixed;left:0;top:0;z-index:15;pointer-events:none;will-change:transform}
.chip.pulse{animation:pulse .25s}
@keyframes pulse{50%{transform:scale(1.16)}}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.place{background:rgba(20,12,40,.62);backdrop-filter:blur(6px);border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:17px;line-height:1.1;display:flex;flex-direction:column;gap:2px;min-width:0}
.place{pointer-events:auto;text-align:left;color:inherit;font-family:var(--display);position:relative}
.place::after{content:"지도 ▾";position:absolute;right:8px;top:8px;font:700 10px var(--body);color:var(--gold);opacity:.9}
.place small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.lvline{display:flex;align-items:center;gap:6px;font:400 13px var(--display);color:var(--gold)}
.xpbar{flex:1;min-width:56px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ff0ff,#7fe3ff);border-radius:inherit}
.wallet{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(20,12,40,.62);backdrop-filter:blur(6px);border-radius:999px;padding:5px 11px 5px 6px;font:400 15px var(--display);font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#ffcf4a 45%,#c98a12);box-shadow:inset 0 -2px 0 #a86f08}
.gem{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#e6fbff,#7fe3ff 50%,#3a8fd8);box-shadow:inset -2px -2px 0 #2a6fb0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ffe58a,#ff9fd0);transition:width .15s}
#bossbox{display:none;background:rgba(40,8,24,.72);border:1px solid rgba(255,107,127,.5);border-radius:14px;padding:6px 12px;gap:4px;flex-direction:column}
#bossbox.on{display:flex}
#bossbox .bar i{background:linear-gradient(90deg,#ff4d6d,#ff9f1c)}
.boss-top{display:flex;justify-content:space-between;font:400 14px var(--display)}
#retry{pointer-events:auto;display:none;align-self:flex-end;background:linear-gradient(180deg,#ff8fa8,#e2456b);padding:8px 14px;border-radius:12px;font:400 15px var(--display);box-shadow:0 3px 0 #a0284a}
#retry.on{display:block}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font:400 34px var(--display);color:#fff;-webkit-text-stroke:5px #3a0a2a;paint-order:stroke fill;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;pointer-events:none}
#banner.on{opacity:1;transform:scale(1)}
#gainlog{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;pointer-events:none;font:700 12px var(--body);text-shadow:0 1px 2px #000,0 0 3px #000}
#gainlog div{display:flex;align-items:center;gap:5px}
#gainlog .coin{width:14px;height:14px}
#gainlog .gem{width:12px;height:12px}
.xpdot{display:inline-block;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8fbff,#9a6cff 55%,#4a2aa8)}
/* Skill bar */
#skillbar{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;padding:18px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(26,18,48,0),rgba(26,18,48,.82) 45%);pointer-events:none}
#skillbar .slots{pointer-events:auto}
#tierTag{font:400 14px var(--display);color:var(--gold);line-height:1.1;flex:1;min-width:0}
#tierTag small{display:block;color:var(--muted);font:700 11px var(--body)}
.slots{display:flex;gap:8px}
.sk{position:relative;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:400 13px var(--display);color:#1a1230;background:var(--c,#888);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.12);transition:transform .12s}
.sk span{background:rgba(255,255,255,.75);border-radius:6px;padding:1px 5px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sk.empty{background:#3a2d63}
.sk.now{transform:translateY(-4px) scale(1.06);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #fff,0 0 18px var(--c)}
.sk b{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 11px var(--body);display:grid;place-items:center}
/* Panel */
#sheet{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));height:min(58%,560px);z-index:5;display:flex;flex-direction:column;background:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);transform:translateY(calc(100% + 80px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet.tall{height:min(78%,760px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.sheet-head b{font:400 19px var(--display)}
.sheet-head::before{content:"";position:absolute;left:50%;top:6px;width:42px;height:4px;margin-left:-21px;border-radius:4px;background:#4a3a80}
#sheetClose{min-height:40px;min-width:64px;border-radius:12px;background:var(--panel-2);font:400 14px var(--display)}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
#panel h3{font:400 18px var(--display);margin:8px 0 8px}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:10px 10px 10px 12px}
.row .info{flex:1;min-width:0}
.row .name{font:400 16px var(--display)}
.row .desc{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.lv{font:700 12px var(--body);color:var(--gold);margin-left:4px}
.buy{min-width:96px;min-height:44px;border-radius:14px;padding:6px 10px;background:linear-gradient(180deg,#ffe58a,#ffbe2e);color:#3a2400;font:400 15px var(--display);box-shadow:0 3px 0 #b97f0c;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.buy.gemb{background:linear-gradient(180deg,#bff3ff,#56c8f0);color:#06324a;box-shadow:0 3px 0 #2a8ab8}
.buy.off{filter:grayscale(.7) brightness(.8)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b97f0c}
.btn{min-height:44px;border-radius:14px;padding:8px 14px;background:var(--panel-2);font:400 15px var(--display);box-shadow:0 3px 0 #1a1230}
.btn.pri{background:linear-gradient(180deg,#ff9fd8,#d85aa8);box-shadow:0 3px 0 #8a2a68}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 0}
/* Gear sub tabs, relics, costumes, star items */
.subtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);border-radius:14px;padding:4px;margin-bottom:10px}
.subtabs button{min-height:40px;border-radius:10px;font:400 15px var(--display);color:var(--muted)}
.subtabs button[aria-selected="true"]{background:linear-gradient(180deg,#ffe58a,#ffbe2e);color:#3a2400}
.subtabs.n5{grid-template-columns:repeat(5,minmax(0,1fr))}.subtabs.n5 button{font-size:14px;padding:0 2px}
.subtabs.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.lockrow{opacity:.62}.lockrow .need{color:#ffd84a;font-size:13px}.lockic{font-size:18px}
#buffs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(214px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;pointer-events:none}
#buffs span{background:rgba(20,12,40,.78);border:1px solid #6a4ad0;border-radius:10px;padding:2px 6px;font:400 12px var(--display);color:#fff;font-variant-numeric:tabular-nums}
.alchhead{display:flex;gap:12px;align-items:center;background:radial-gradient(circle at 15% 50%,#3a5a20,var(--panel) 60%);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.alchhead b{font:400 20px var(--display);color:#bfff8a;display:block}.cauldron{font-size:40px;filter:drop-shadow(0 0 8px #8fff6a)}
.ricon.pt{background:linear-gradient(180deg,#2a4a2a,#142414);box-shadow:inset 0 0 0 2px #8fd86a}
.potion.on{box-shadow:inset 0 0 0 2px #8fff6a,0 0 10px rgba(143,255,106,.25)}.tleft{color:#bfff8a;font-weight:700}
.gstars{font-size:14px;letter-spacing:1px;color:#4a3a2a}.gstars i{font-style:normal}.gstars i.on{color:#ffd84a;text-shadow:0 0 6px #ffb02e}
.bcell .bst{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font:400 11px var(--display);color:#ffd84a;text-shadow:0 1px 2px #000}
.bagbtns .tr small{display:block;font:700 10px var(--body);opacity:.85}.bagbtns .tr{grid-column:span 2}
.runering{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle,#2a1a4a 0 34%,transparent 35%),conic-gradient(from 0deg,#ff6a2b33,#3fb6ff33,#5fe39a33,#c99a5b33,#ffe14a33,#a77bff33,#ff6a2b33);box-shadow:inset 0 0 0 2px #5a3a8a}
.rune{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,var(--rc) -40%,#1a1030 70%);box-shadow:inset 0 0 0 2px var(--rc),0 0 10px var(--rc);transform:rotate(calc(var(--i) * 60deg)) translateY(-104%) rotate(calc(var(--i) * -60deg))}
.rune span{font-size:24px;line-height:1}.rune b{font:400 11px var(--display);color:#fff;text-shadow:0 1px 2px #000}
.rune.sel{box-shadow:inset 0 0 0 3px #fff,0 0 16px var(--rc)}
.rcore{position:absolute;inset:35%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.rcore b{font:400 18px var(--display);color:#e0c8ff}.rcore small,.rcore span{font-size:10px;color:var(--muted)}
.sghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font:400 14px var(--display)}.sghead b{color:#8ff59a}
.sgsets{display:flex;gap:4px}.sgsets .btn{min-width:36px;min-height:34px;padding:0}
.sggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:8px}
.sggrid.inv{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:12px;padding:4px 2px}
.pulls.sgpulls .pull{min-height:60px;padding:8px}
.sggrid.got{grid-template-columns:repeat(5,minmax(0,1fr));max-height:50vh;overflow:auto;margin:8px 0;padding:6px 4px 10px;row-gap:12px}
.sgcell{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--gc,#555) 55%,#000) 0 45%,#140c24 46% 58%,color-mix(in srgb,var(--gc,#555) 80%,#000) 60%);box-shadow:0 0 0 2px color-mix(in srgb,var(--gc,#555) 70%,#fff)}
.sgcell i{font-style:normal;font-size:20px;line-height:1}
.sgcell .tg{position:absolute;left:-2px;top:-3px;font:400 9px var(--display);background:color-mix(in srgb,var(--gc,#555) 80%,#000);color:#fff;border-radius:6px;padding:0 3px}
.sgcell .q{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 8px var(--body);color:#fff;background:rgba(0,0,0,.65);border-radius:6px;padding:0 3px}
.sgcell .lk{position:absolute;right:-2px;top:-3px;font-size:10px}
.sgcell.sel{box-shadow:0 0 0 3px #fff,0 0 12px #fff}.sgcell.eq::after{content:'E';position:absolute;right:-3px;bottom:-3px;font:400 9px var(--display);background:#fff;color:#3a2400;border-radius:4px;padding:0 2px}
.sgcell.empty{background:#1a1230;box-shadow:inset 0 0 0 2px #3a2a5a}.sgcell.lockd{background:#120c20;box-shadow:inset 0 0 0 1px #2a1d40;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}.sgcell.lockd small{font-size:8px;color:var(--muted)}
.sglv{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.sglv span{display:flex;flex-direction:column;font:400 14px var(--display)}.sglv b{color:#8fd8ff}
.sgeff{margin-bottom:8px}.sgeff p{margin:2px 0;font-size:13px;color:#ffe08a}
.sgsel{background:var(--panel);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 2px var(--gc);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sgsel b{font:400 16px var(--display);display:block}.sgbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.sgbtns .btn{min-height:40px;padding:0 4px;font-size:13px}
.dung.dg-rune{box-shadow:inset 0 0 0 2px #9a6aff}.dung.lockd{opacity:.55}
.sbtns{display:flex;gap:4px;flex:none}.sbtns .btn{min-width:0;padding:0 10px;font-size:13px}
.codebox{width:100%;min-height:120px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:#120c24;color:var(--text);font:12px/1.4 ui-monospace,monospace;padding:8px;word-break:break-all;resize:vertical;box-sizing:border-box}
.rune{box-shadow:inset 0 0 0 3px var(--rg),0 0 10px var(--rc)}.rune .rgn{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:400 10px var(--display);font-style:normal;background:var(--rg);color:#140c24;border-radius:6px;padding:0 4px;white-space:nowrap}
.cbtns .buy{flex-direction:column;gap:0;line-height:1.1;font-size:13px;padding:4px}
.cstars{font-size:11px;color:#4a3a2a;letter-spacing:1px}.cstars i{font-style:normal}.cstars i.on{color:#ffd84a;text-shadow:0 0 6px #ffb02e}
.packs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pack{display:flex;gap:10px;align-items:center;background:linear-gradient(120deg,#3a1d5a,var(--panel) 70%);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 2px #7a4ad0}
.pack .picon{font-size:30px}.pack .info{flex:1;min-width:0}.pack .name{font:400 16px var(--display)}.pack .desc{font-size:12px;color:var(--muted);margin-top:2px}.pack .buy{min-width:84px}
.pulls.relicpulls{grid-template-columns:repeat(3,minmax(0,1fr))}.pulls.relicpulls .pull{grid-column:auto;min-height:72px;padding:10px}.pulls.relicpulls .pull b{font-size:16px}
.relic .ricon{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:26px;border-radius:12px;background:linear-gradient(180deg,#6b2230,#3a1020);box-shadow:inset 0 0 0 2px #c2475a}
.relic.divine .ricon{background:linear-gradient(180deg,#7a5a10,#3a2a04);box-shadow:inset 0 0 0 2px #ffd84a,0 0 10px rgba(255,216,74,.4)}
.relic.divine .name{color:var(--gold)}
.relic.none{opacity:.5}
.lv{font:700 12px var(--body);color:var(--muted);margin-left:4px}
.rgot{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;max-height:50vh;overflow:auto;margin:8px 0}
.rgot div{background:var(--panel);border-radius:12px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px #c2475a}
.rgot div.divine{box-shadow:inset 0 0 0 2px #ffd84a,0 0 12px rgba(255,216,74,.5)}
.rgot span{font-size:24px}.rgot small{font-size:10px;line-height:1.15;color:var(--muted)}.rgot b{font:400 12px var(--display)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ccard{background:var(--panel);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:inset 0 0 0 2px var(--gc);min-width:0}
.ccard.on{box-shadow:inset 0 0 0 3px var(--gold),0 0 14px rgba(255,216,74,.35)}
.ccard.none img{filter:grayscale(.6) brightness(.7)}

#tierTag small{font:700 12px/1.35 var(--body);color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slots{gap:7px}.sk{width:48px;height:48px;border-radius:15px}
.sk span{font-size:12.5px}
/* tab bar */
#tabs{gap:0;background:linear-gradient(180deg,#1a1338,#0c0820 70%);border-top:0;box-shadow:0 -10px 26px rgba(4,2,14,.55);padding-top:6px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}
#tabs::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 25%,rgba(255,255,255,.22) 75%,transparent)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:53px;padding:2px 0;border-radius:14px;font:700 11px var(--body);letter-spacing:-.02em;color:#8178ad;transition:color .2s}
#tabs svg{width:42px;height:28px;padding:3px 10px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .2s,box-shadow .2s}
#tabs [data-tab="more"] svg{fill:currentColor;stroke:none}
#tabs button[aria-selected=true]{background:none;color:#fff}
#tabs button[aria-selected=true] svg{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 3px 12px rgba(255,255,255,.18)}
/* sheet */
#sheet{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));border-top:1px solid #2c2358;box-shadow:0 -14px 34px rgba(0,0,0,.5)}
.sheet-head{padding-top:16px;padding-bottom:8px}
.sheet-head::before{background:#3a2f6a}
.sheet-head b{font-size:21px}
#sheetClose{min-height:38px;min-width:0;padding:0 16px;border-radius:999px;background:var(--panel-2);font:700 14px var(--body);color:var(--text)}
#panel{padding-top:6px;padding-bottom:20px}
#panel h3{font-size:17px;margin:16px 0 10px}
.note{font-size:13px;line-height:1.55}
/* sub tabs: one segmented row that always fits */
.subtabs,.subtabs.n5,.subtabs.n6{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:14px;background:#0e0921;border:1px solid var(--line);margin-bottom:12px}
.subtabs button,.subtabs.n5 button{min-height:38px;padding:0 2px;border-radius:11px;font:700 13.5px var(--body);letter-spacing:-.03em;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 2px 8px rgba(0,0,0,.35)}
/* chips inside a page (gear kind, sigil grade filter) */
.kindtabs{gap:6px;padding:2px 0 8px}
.kindtabs button{min-height:36px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid var(--line);font:700 13.5px var(--body);color:var(--muted)}
.kindtabs button[aria-selected="true"]{background:rgba(255,255,255,.14);border-color:var(--sel);color:#fff}
.kindtabs i{right:3px;top:3px;width:7px;height:7px}
/* buttons: gold = main action, flat violet = other actions, gold outline = currently chosen */
.buy{min-height:44px;border-radius:13px;background:linear-gradient(180deg,#ffdc66,#ffbf2e);color:var(--gold-ink);box-shadow:0 2px 0 #b07a0a;font:700 15px var(--body)}
.buy.gemb{background:linear-gradient(180deg,#c4f4ff,#5fcdf2);color:#05314a;box-shadow:0 2px 0 #2a86b2}
.buy.off,.buy.gemb.off{filter:none;background:#2f2858;color:#9d93c6;box-shadow:none}
.buy:active,.btn:active{transform:translateY(1px)}
.btn{min-height:44px;border-radius:13px;padding:8px 12px;background:var(--panel-2);border:1px solid #42377a;box-shadow:none;font:700 14px var(--body);color:var(--text)}
.btn.pri{background:linear-gradient(180deg,#ffdc66,#ffbf2e);border-color:transparent;color:var(--gold-ink);box-shadow:0 2px 0 #b07a0a}
.btn.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.85);color:#fff}
.btn.off{opacity:.42}
.btns{gap:8px}
/* rows and cards */
.row{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px 12px 12px 14px;gap:12px}
.row .name{font-size:16px;line-height:1.25}
.row .desc{font-size:13px;line-height:1.45;margin-top:3px}
.lv{font:700 12px var(--body);color:var(--gold)}
.row .buy{min-width:92px}
.codexbar,.manaline,.tpoints,.shards{background:var(--panel);border:1px solid rgba(255,255,255,.05);font:700 14px var(--body)}
.codexbar b,.manaline b,.tpoints b{font-size:14px}
/* gear bag */
.bagtop{background:var(--panel);border:1px solid rgba(255,255,255,.05);padding:12px;gap:12px}
.binfo{gap:4px}.binfo b{font-size:19px}
.eff{font:700 14px var(--body)}
.eff small,.potbox small{display:block;font:700 11.5px var(--body);color:var(--faint);letter-spacing:.02em;margin-top:3px}
.potbox p{font:700 12.5px var(--body)}
.bagbtns{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 14px}
.bagbtns [data-blv]{grid-column:span 2;flex-direction:row;gap:8px;font-size:15px}
.bagbtns [data-blv] small{font-size:14px}
.bagbtns .btn{font-size:13px;padding:6px 4px}
.bagbtns .tr{grid-column:span 3;line-height:1.25}
.bagbtns .tr small{font-size:11px;color:var(--muted);margin-top:2px}
.bagacts{margin:4px 0 10px}
.bcell .tg{font:700 11px var(--body);font-style:normal}
.bcell .blv,.bcell .bn{font:700 11px var(--body)}
.gstars{font-size:15px}
/* shop, packs, modals, toast */
.notice{background:rgba(255,143,168,.1);border-color:rgba(255,143,168,.5);font-size:13px}
.prod{border:1px solid rgba(255,255,255,.05)}
.card{background:linear-gradient(180deg,#2c2257,#1b1438);border-color:#40357a}
.card p{font-size:14px;color:var(--muted)}
#toast{bottom:calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px));font-size:14px}
.sbtns .btn{font-size:13px}
/* ===== Round 7d: calm palette ===== */
#app,#sheet{background:var(--ink)}
#sheet{border-top:1px solid rgba(255,255,255,.07);box-shadow:0 -14px 34px rgba(0,0,0,.55)}
.sheet-head::before{background:rgba(255,255,255,.18)}
#sheetClose{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.place,.chip{background:rgba(12,13,22,.72);border-color:rgba(255,255,255,.1)}
#tabs{background:linear-gradient(180deg,#151726,#0b0c14 70%)}
#tabs button{color:#7d809e}
.subtabs,.subtabs.n5,.subtabs.n6{background:#0a0b12;border-color:rgba(255,255,255,.08)}
.subtabs button,.subtabs.n5 button{color:var(--muted)}
.kindtabs button{border-color:rgba(255,255,255,.12)}
.row,.bagtop,.prod,.codexbar,.manaline,.tpoints,.shards{background:var(--panel);border:1px solid rgba(255,255,255,.06)}
.row .lv,.lv{display:inline-block;font:700 11px var(--body);color:#cfd1e6;background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* price buttons: soft gold tint, no heavy block */
.buy{background:linear-gradient(180deg,rgba(255,215,110,.2),rgba(255,215,110,.1));border:1px solid rgba(255,215,110,.55);color:var(--gold-soft);box-shadow:none;font:700 15px var(--body)}
.buy.gemb{background:linear-gradient(180deg,rgba(143,228,255,.2),rgba(143,228,255,.1));border-color:rgba(143,228,255,.55);color:var(--gem-soft);box-shadow:none}
.buy.off,.buy.gemb.off{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:#6b6e88;box-shadow:none}
.buy.off .coin,.buy.off .gem{filter:grayscale(.6) brightness(.8)}
.buy:active{background:rgba(255,215,110,.28)}
/* other buttons: quiet glass; main confirm = white */
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.btn.pri{background:var(--sel-grad);border-color:transparent;color:var(--sel-ink);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.btn.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.85);color:#fff}
#retry{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 3px 12px rgba(0,0,0,.4)}
.card{background:linear-gradient(180deg,#1f2234,#151726);border-color:rgba(255,255,255,.1)}
.notice{background:rgba(255,120,150,.08);border-color:rgba(255,140,165,.4);color:#ffd2dc}
.pack{background:linear-gradient(120deg,#23263b,var(--panel) 70%);box-shadow:inset 0 0 0 1px rgba(255,215,110,.35)}
.pull{background:linear-gradient(160deg,#262a42,#181a2a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pull.big{background:linear-gradient(160deg,#3a2d4f,#1d1a2c);box-shadow:inset 0 0 0 1px rgba(255,215,110,.35)}
.gacha-head,.alchhead,.rankbox,.tinfo,.ttree{background:var(--panel);border:1px solid rgba(255,255,255,.06)}
.ttree{background:radial-gradient(circle at 50% 40%,#22263c,var(--panel))}
.tnode{background:linear-gradient(160deg,#262a42,#1a1c2c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.slotpick{background:var(--panel);border-color:rgba(255,255,255,.1)}
.srow,.dsel{background:var(--panel)}
.rchip{background:var(--panel-2)}
.rchip.on{background:var(--sel-grad);color:var(--sel-ink);box-shadow:none}
.eslot,.item{background:var(--panel)}
#toast{background:rgba(16,17,28,.94);border-color:rgba(255,255,255,.12)}
.slotout{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.dung{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.dung.dg-gold{box-shadow:inset 0 0 0 1px rgba(255,200,90,.45)}.dung.dg-mana{box-shadow:inset 0 0 0 1px rgba(110,170,255,.45)}.dung.dg-gem{box-shadow:inset 0 0 0 1px rgba(90,220,235,.45)}.dung.dg-rune{box-shadow:inset 0 0 0 1px rgba(180,140,255,.45)}
.bcell .gimg{width:70%;height:70%}.bcell.big .gimg{width:74%;height:74%}.eslot .gimg{width:64%;height:64%}.gcard .gimg{width:62%;height:50%}
/* ---------- drawn pictures (js/icons.js): skills, runes, sigils, gear grades, currencies ---------- */
.ico{display:block;width:100%;height:100%;overflow:visible}
.icur{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.buy .icur{width:1.05em;height:1.05em}
.ico .orb{transform-box:view-box;transform-origin:32px 32px;animation:spin 9s linear infinite}.ico .orb.rev{animation-duration:6s;animation-direction:reverse}
/* skills: a dark tile tinted with the spell colour, the spell's shape on top (no names) */
.sk{width:54px;height:54px;border-radius:17px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c,#888) 46%,#1b1430),#120d20 82%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c,#888) 70%,#000),inset 0 -5px 0 rgba(0,0,0,.28),0 3px 0 rgba(0,0,0,.35);padding:5px!important;flex:none}
.sk .ico{filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.sk.empty{background:#1c1e30;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}.sk.empty b{position:static;background:none;box-shadow:none;color:var(--faint);font:400 18px var(--display)}
.sk.now{transform:translateY(-5px) scale(1.1);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--c),0 0 18px var(--c)}
.sk.now .ico{animation:skbob .5s ease-in-out infinite alternate}
@keyframes skbob{to{transform:scale(1.1) rotate(-4deg)}}
.sk b{top:-7px;right:-7px;min-width:20px;width:auto;height:20px;padding:0 4px;border-radius:10px;background:#0f1019;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c,#888) 80%,#fff);font:700 10.5px var(--body)}
.slots{gap:9px}
.skrow .sk{padding:6px!important}
.slotpick{min-height:84px;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c,#3a2d63) 70%,#000)}
.spi{width:44px;height:44px;display:grid;place-items:center}.spi.none{font:400 26px var(--display);color:var(--faint);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
/* runes: carved stones on a ring; lines of power run from the core to every awakened stone */
.runering{background:radial-gradient(circle,#231a3c 0 30%,#16122a 31% 66%,transparent 67%);box-shadow:none;width:300px;max-width:none}
.rlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rlines .flow{stroke-dasharray:5 6;animation:rflow 1.1s linear infinite}
@keyframes rflow{to{stroke-dashoffset:-22}}
.rune{transform:rotate(calc(var(--i) * 60deg)) translateY(-104px) rotate(calc(var(--i) * -60deg));width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:0;background:none;box-shadow:none!important;padding:0;transition:filter .15s}
.rune .ico{width:60px;height:60px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.rune .glyph,.ricon .glyph{filter:drop-shadow(0 0 2.5px currentColor)}
.rune.zero .ico{filter:grayscale(.9) brightness(.6)}
.rune b{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#0f1019;border-radius:8px;padding:0 6px;font:700 10.5px var(--body);white-space:nowrap;box-shadow:0 0 0 1.5px var(--rc)}
.rune .rgn{top:-9px;z-index:1}
.rune.sel .ico{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px var(--rc));transform:scale(1.1)}
.rune.up .ico{animation:runeup .34s ease-out}
@keyframes runeup{0%{transform:scale(1.42);filter:brightness(2.3) drop-shadow(0 0 16px var(--rc))}100%{transform:scale(1.1)}}
.rcore{border-radius:50%;inset:35.5%;background:radial-gradient(circle,#3a2a66,#1a1230);box-shadow:inset 0 0 0 2px #6a55b0}
.rcore.lit{box-shadow:inset 0 0 0 2px #cdb8ff,0 0 18px #9a7bff;animation:corep 2.2s ease-in-out infinite}
@keyframes corep{50%{box-shadow:inset 0 0 0 2px #fff,0 0 30px #b79bff}}
.row>.ricon{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:16px;font-size:26px}
.ricon .irune{width:88%;height:88%}
.sglv>span{display:block}.sglv>span small{display:block}.sglv .buy span{display:inline-flex;flex-direction:row;align-items:center;gap:3px}
/* sigils (신성력): holy gems — the cut shows the grade, the mark shows the stat, the dots show the quality */
.sgcell{border-radius:16px;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--gc,#555) 34%,transparent),rgba(20,16,36,.9) 72%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gc,#555) 55%,transparent);padding:4px}
.sgcell .ico{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.sgcell .isg.b3,.sgcell .isg.b4,.sgbig .isg.b3,.sgbig .isg.b4{animation:sgfloat 2.4s ease-in-out infinite}
@keyframes sgfloat{50%{transform:translateY(-2px);filter:drop-shadow(0 0 7px var(--gc))}}
.sgcell .q{bottom:-6px;font:700 8.5px var(--body);background:#0f1019;box-shadow:0 0 0 1px color-mix(in srgb,var(--gc,#555) 70%,transparent)}
.sgcell .tg{left:1px;top:-5px;z-index:1}
.sgcell.sel{box-shadow:inset 0 0 0 2.5px #fff,0 0 12px var(--gc)}
.sgcell.empty{background:#141626;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08)}.sgcell.empty::before{content:'';width:34%;height:34%;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.sgcell.lockd{border-radius:16px}
.sggrid.got .sgcell{animation:sgpop .42s cubic-bezier(.2,1.5,.4,1) backwards}
.sggrid.got .sgcell:nth-child(2){animation-delay:.07s}.sggrid.got .sgcell:nth-child(3){animation-delay:.14s}.sggrid.got .sgcell:nth-child(4){animation-delay:.21s}.sggrid.got .sgcell:nth-child(5){animation-delay:.28s}.sggrid.got .sgcell:nth-child(n+6){animation-delay:.35s}
@keyframes sgpop{0%{opacity:0;transform:scale(.2) rotate(-25deg);filter:brightness(3)}}
.sgselhead{display:flex;align-items:center;gap:10px}.sgbig{width:62px;height:62px;flex:none}
/* gear: each grade has its own colours and motif, each step I~IV more trimmings */
.gart{position:relative;display:block;width:76%;aspect-ratio:1;flex:none}
.gart .ico,.bcell .gart .ico,.gcard .gart .ico,.eslot .gart .ico{position:absolute;inset:0;width:100%!important;height:100%!important}
.gart .ico.gback,.bcell .gart .ico.gback,.gcard .gart .ico.gback{inset:-9%!important;width:118%!important;height:118%!important;opacity:.9}
.gart .gimg.tinted{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))!important}.gart.g4 .gimg.tinted{filter:drop-shadow(0 0 4px rgba(255,200,60,.7))!important}.gart.g5 .gimg.tinted{filter:drop-shadow(0 0 5px rgba(255,80,110,.85))!important}
.bcell .tg,.bcell .blv,.bcell .bn,.bcell .E,.bcell .bst{z-index:2}
.gart .gimg,.bcell .gart .gimg,.gcard .gart .gimg{position:absolute;left:14%;top:14%;width:72%!important;height:72%!important}
.gart.g0 .gimg{filter:grayscale(.85) brightness(1.02) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.gart.g1 .gimg{filter:hue-rotate(72deg) saturate(.95) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.gart.g2 .gimg{filter:hue-rotate(168deg) saturate(1.1) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.gart.g3 .gimg{filter:hue-rotate(236deg) saturate(1.05) drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.gart.g4 .gimg{filter:saturate(1.15) brightness(1.05) drop-shadow(0 0 4px rgba(255,200,60,.7))}
.gart.g5 .gimg{filter:hue-rotate(-48deg) saturate(1.35) drop-shadow(0 0 5px rgba(255,80,110,.85))}
.gart.s4 .gimg,.gart.s4 .gstaff{animation:gfloat 2.2s ease-in-out infinite}
@keyframes gfloat{50%{transform:translateY(-3%)}}
.gshine{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;mix-blend-mode:screen}
.gshine::after{content:'';position:absolute;top:-20%;left:-60%;width:38%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(20deg);animation:gsweep 2.6s ease-in-out infinite}
@keyframes gsweep{0%,55%{left:-60%}100%{left:130%}}
.bcell{padding:14px 2px}.bcell .gart{width:78%}.bcell.big .gart{width:80%}.gcard .gart{width:66%}
.bcell:has(.g5){background:radial-gradient(circle at 50% 40%,#5a1830,#1c0a18)}.bcell:has(.g4){background:radial-gradient(circle at 50% 40%,#5a3c0c,#1c1406)}
.bcell:has(.g3){background:radial-gradient(circle at 50% 40%,#3a1f66,#150c26)}.bcell:has(.g2){background:radial-gradient(circle at 50% 40%,#173a70,#0a1426)}
.bcell:has(.g1){background:radial-gradient(circle at 50% 40%,#1c4a2a,#0a1a10)}.bcell:has(.g0){background:radial-gradient(circle at 50% 40%,#3a3d48,#15161c)}
/* emoji pictures all sit in the same round badge so they read as one set */

.relic.divine .ricon{background:radial-gradient(circle at 50% 30%,#6a5010,#221803);box-shadow:inset 0 0 0 1.5px #ffd84a,0 0 10px rgba(255,216,74,.35)}
.imisc{filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}

.dcard .dicon{width:72px;height:72px;margin:6px auto;filter:drop-shadow(0 0 10px rgba(255,190,60,.55))}
#buffs span{display:inline-flex;align-items:center;gap:3px}#buffs .ico{width:16px;height:16px}

/* ---------- battle screen layout: profile + wallet on top, stage plate in the middle, big skill tiles, picture menu ---------- */
#hud{gap:7px}
.hud-row{align-items:center}
.prof{display:flex;align-items:center;gap:9px;min-width:0;padding:4px 16px 4px 4px;border-radius:999px;background:rgba(12,13,22,.74);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.ava{width:44px;height:44px;flex:none;border-radius:50%;background:#ffe2b0 url(art/hero.webp) 47% 24%/235% no-repeat;box-shadow:0 0 0 2px #ffcf4a,0 0 0 4px #2b1838}
.pi{display:flex;flex-direction:column;gap:4px;min-width:0}
.pl{display:flex;align-items:baseline;gap:6px;min-width:0}
#lvTxt{font:400 15px var(--display);color:var(--gold)}
