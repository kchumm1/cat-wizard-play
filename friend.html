<script>
// New version: the worker stores every file first (copies the unchanged ones, downloads the rest), then takes over; the
// page saves and restarts once, right away. Listened for from the page's first script: an update that only copies can
// take over before the page has loaded (2026-11-17, pretend iPhone: at 2.0 s, load at 2.4 s; tests/site.test.cjs).
if ('serviceWorker' in navigator) (function () {
  var had = !!navigator.serviceWorker.controller, done = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!had) { had = true; return; }
    if (done) return; done = true;
    try { sessionStorage.setItem('cwJustUpdated', '1'); } catch (e) {}
    try { dispatchEvent(new Event('pagehide')); } catch (e) {}
    var t = document.getElementById('toast'); if (t) { t.textContent = '새 버전을 받았어요. 다시 여는 중…'; t.classList.add('on'); }
    setTimeout(function () { location.reload(); }, 700);
  });
})();
</script>

<style>
/* Layout: one-screen portrait game — HUD over a 3D stage, skill bar, tabbed panel, tab bar. Single dark night-sky look. */
:root{
  --ink:#0f1019; --panel:#181a28; --panel-2:#22253a; --line:#2c2f47; --text:#f3f3f8; --muted:#a9abc3; --faint:#7d809e; --gold-ink:#3a2600; --tabh:64px; --sel:#ffffff; --sel-ink:#14151f; --sel-grad:linear-gradient(180deg,#ffffff,#e6e7ef);
  --gold-soft:#ffd76e; --gem-soft:#8fe4ff;
  --gold:#ffcf4a; --gem:#7fe3ff; --accent:#ff8fd0; --ok:#6fe08a; --bad:#ff6b7f;
  --g0:#a3a7ad; --g1:#4fc46a; --g2:#3d8bfd; --g3:#a259ff; --g4:#ff9f1c; --g5:#ff4d6d; --g6:#2fd6b3; --g7:#ffc21a; --g8:#7b3cff; --g9:#ff2a3a;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;background:var(--ink);user-select:none;-webkit-user-select:none;overflow:hidden}
/* the battle fills the whole phone; menus slide up over it */
#stage{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the region's picture behind the fight (scene.js), stretched to the screen: all of it shows, nothing cut off */
/* 성장 rows (js/grow-text.js): a plain sentence, then a soft box of label | value lines. Every label is the same-width
   chip, so the values start at the same place in every line of every row */
.row.grow .name{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.row.grow .name .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}
.row.grow .name .lv{flex:none;margin-left:0;font-size:10.5px;padding:1px 5px}
/* the row as a grid: the name line runs the full width on top (never pushed by the button); the sentence, the box and
   the buy button share the lines under it. The button stacks ×N over the price, and every button in the list is as wide
   as the widest price (ui.js fitGrowNames) */
#sheet .row.grow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ic nm nm" "ic ab bu" "gl gl gl";column-gap:10px;row-gap:0;align-items:center}
#sheet .row.grow .info{display:contents}
#sheet .row.grow .ricon{grid-area:ic;align-self:center}
#sheet .row.grow .name{grid-area:nm}
#sheet .row.grow .gabout{grid-area:ab;align-self:end}
#sheet .row.grow .glines{grid-area:gl;align-self:start;margin-top:8px}
#sheet .row.grow .buy{grid-area:bu;min-width:0;width:var(--buyw,auto);min-height:42px;padding:5px 9px;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15;white-space:nowrap;font-size:14.5px}
#sheet .row.grow .buy small{font:700 10.5px/1.1 var(--body);opacity:.75}
#sheet .row.grow .buy .bp{display:inline-flex;align-items:center;gap:3px}
#sheet .row.grow .buy .coin{width:16px;height:16px;flex:none}
.row.grow .gabout{font:500 12px/1.4 var(--body);color:var(--muted);margin:3px 0 6px}
.row.grow .glines{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 8px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(150,115,70,.08);box-shadow:inset 0 0 0 1px rgba(150,115,70,.12)}
.row.grow .glines b{display:flex;align-items:center;justify-content:center;height:19px;border-radius:6px;font:700 10.5px/1 var(--body);letter-spacing:.02em;color:#7a6a5a;background:rgba(150,115,70,.14)}
.row.grow .glines span{min-width:0;font:600 12.5px/19px var(--body);font-variant-numeric:tabular-nums;color:#4a3d32;overflow-wrap:anywhere}
.row.grow .glines .gl-next{color:#2f7d3c;background:rgba(70,160,90,.16)}.row.grow .glines .gl-next+span{color:#2f7d3c;font-weight:800}
.row.grow .glines .gl-over{color:#b4521f;background:rgba(220,110,50,.15)}.row.grow .glines .gl-over+span{color:#b4521f;font-weight:800}
.row.grow .glines .gl-dmg{color:#7a4fa0;background:rgba(140,90,190,.14)}
.row.grow .glines .gl-max+span{color:#8a7a6a}
.stagebg{position:absolute;inset:0;display:none;pointer-events:none;background:center/100% 100% no-repeat;will-change:transform}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg{position:absolute;left:0;top:0;font:400 19px var(--display);color:#fff;-webkit-text-stroke:4px #2a1030;paint-order:stroke fill;opacity:0;white-space:nowrap;will-change:transform}
.dmg.crit{color:var(--gold);font-size:26px}
.dmg small{display:block;font-size:.5em;line-height:1;text-align:center;letter-spacing:.02em}
/* 크리티컬 단계 숫자 색 (2026-11-16): 무지개였던 걸 한 계열로 — 노랑(치명타) → 주황 → 빨강(제네시스). 단계는 크기·위의 작은 이름으로 구분, 빛번짐은 높은 단계만 같은 색으로 은은하게 */
.dmg.c2{color:#ffc43a;font-size:31px;-webkit-text-stroke:5px #3a1a06;paint-order:stroke fill}
.dmg.c3{color:#ffad33;font-size:36px;-webkit-text-stroke:5px #3a1606;paint-order:stroke fill}
.dmg.c4{font-size:42px;color:#ff9a2e;-webkit-text-stroke:6px #3a1406;paint-order:stroke fill}
.dmg.c5{font-size:46px;color:#ff872a;-webkit-text-stroke:6px #3a1006;paint-order:stroke fill}
.dmg.c6{font-size:50px;color:#ff7428;-webkit-text-stroke:6px #3a0e06;paint-order:stroke fill;text-shadow:0 0 10px rgba(255,116,40,.45)}
.dmg.c7{font-size:54px;color:#ff6026;-webkit-text-stroke:7px #340a06;paint-order:stroke fill;text-shadow:0 0 12px rgba(255,96,38,.5)}
.dmg.c8{font-size:56px;color:#ff4d28;-webkit-text-stroke:7px #300806;paint-order:stroke fill;text-shadow:0 0 14px rgba(255,77,40,.5)}
.dmg.c9{font-size:58px;color:#f53a2e;-webkit-text-stroke:7px #2c0606;paint-order:stroke fill;text-shadow:0 0 16px rgba(245,58,46,.55)}
.dmg.c10{font-size:60px;color:#ff2e3a;-webkit-text-stroke:7px #280408;paint-order:stroke fill;text-shadow:0 0 18px rgba(255,46,58,.6)}
.dmg.crit small{color:#fff0c8}
.screen-flash{position:absolute;inset:0;opacity:0}
.coin.fly{position:fixed;left:0;top:0;z-index:15;pointer-events:none;will-change:transform}
.chip.pulse{animation:pulse .25s}
@keyframes pulse{50%{transform:scale(1.16)}}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.place{background:rgba(20,12,40,.62);backdrop-filter:blur(6px);border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:17px;line-height:1.1;display:flex;flex-direction:column;gap:2px;min-width:0}
.place{pointer-events:auto;text-align:left;color:inherit;font-family:var(--display);position:relative}
.place::after{content:"지도 ▾";position:absolute;right:8px;top:8px;font:700 10px var(--body);color:var(--gold);opacity:.9}
.place small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.lvline{display:flex;align-items:center;gap:6px;font:400 13px var(--display);color:var(--gold)}
.xpbar{flex:1;min-width:56px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ff0ff,#7fe3ff);border-radius:inherit}
.wallet{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(20,12,40,.62);backdrop-filter:blur(6px);border-radius:999px;padding:5px 11px 5px 6px;font:400 15px var(--display);font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;background:url(art/ic-gold.webp) 50% 50%/contain no-repeat}
/* gold amounts (ui.js gh): one moderate size in every menu, the letter unit a little smaller */
.gn{font-size:14px;font-weight:inherit;font-family:inherit;letter-spacing:0;white-space:nowrap}
.gn small{font-size:.92em;margin-left:0;opacity:1;font:inherit}
.chip .gn{font-size:15px}.srew .gn,#gainlog .gn,.desc .gn{font-size:12px}
.gem{width:17px;height:17px;background:url(art/ic-gem.webp) 50% 50%/contain no-repeat}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ffe58a,#ff9fd0);transition:width .15s}
#bossbox{display:none;background:rgba(40,8,24,.72);border:1px solid rgba(255,107,127,.5);border-radius:14px;padding:6px 12px;gap:4px;flex-direction:column}
#bossbox.on{display:flex}
#bossbox .bar i{background:linear-gradient(90deg,#ff4d6d,#ff9f1c)}
.boss-top{display:flex;justify-content:space-between;font:400 14px var(--display)}
#retry{pointer-events:auto;display:none;align-self:flex-end;background:linear-gradient(180deg,#ff8fa8,#e2456b);padding:8px 14px;border-radius:12px;font:400 15px var(--display);box-shadow:0 3px 0 #a0284a}
#retry.on{display:block}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;font:400 34px var(--display);color:#fff;-webkit-text-stroke:5px #3a0a2a;paint-order:stroke fill;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;pointer-events:none}
#banner.on{opacity:1;transform:scale(1)}
#gainlog{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:3px;pointer-events:none;font:700 12px var(--body);text-shadow:0 1px 2px #000,0 0 3px #000}
#gainlog div{display:flex;align-items:center;gap:5px}
#gainlog .coin{width:14px;height:14px}
#gainlog .gem{width:14px;height:14px}
.xpdot{display:inline-block;width:14px;height:14px;background:url(art/ic-xp.webp) 50% 50%/contain no-repeat}
.gdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.hpdot{display:inline-block;width:17px;height:15px;flex:none;background:url(art/ui-hpmark.webp) 50% 50%/contain no-repeat}
.hpheart{display:inline-block;width:16px;height:14px;flex:none;background:url(art/ui-hpheart.webp) 50% 50%/contain no-repeat}
/* the user's HP pill (art-src/ui/hp-heart-design.png): cream inside, gold rim, heart, heavy plum "HP n" */
.hpbox{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 9px 0 5px;box-sizing:border-box;border:1.5px solid #ce9242;border-radius:999px;background:#fdedd2;color:#4b122f;font:900 12px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
/* Skill bar */
#skillbar{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:10px;padding:18px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(26,18,48,0),rgba(26,18,48,.82) 45%);pointer-events:none}
#skillbar .slots{pointer-events:auto}
#tierTag{font:400 14px var(--display);color:var(--gold);line-height:1.1;flex:1;min-width:0}
#tierTag small{display:block;color:var(--muted);font:700 11px var(--body)}
.slots{display:flex;gap:8px}
.sk{position:relative;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:400 13px var(--display);color:#1a1230;background:var(--c,#888);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.12);transition:transform .12s}
.sk span{background:rgba(255,255,255,.75);border-radius:6px;padding:1px 5px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sk.empty{background:#3a2d63}
.sk.now{transform:translateY(-4px) scale(1.06);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 3px #fff,0 0 18px var(--c)}
.sk b{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font:700 11px var(--body);display:grid;place-items:center}
/* Panel */
#sheet{position:absolute;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));height:min(58%,560px);z-index:5;display:flex;flex-direction:column;background:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);transform:translateY(calc(100% + 80px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet.tall{height:min(78%,760px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.sheet-head b{font:400 19px var(--display)}
.sheet-head::before{content:"";position:absolute;left:50%;top:6px;width:42px;height:4px;margin-left:-21px;border-radius:4px;background:#4a3a80}
#sheetClose{min-height:40px;min-width:64px;border-radius:12px;background:var(--panel-2);font:400 14px var(--display)}
#panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}

.list{display:flex;flex-direction:column;gap:8px}

.row .info{flex:1;min-width:0}
.row .name{font:400 16px var(--display)}
.row .desc{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.lv{font:700 12px var(--body);color:var(--gold);margin-left:4px}
.buy{min-width:96px;min-height:44px;border-radius:14px;padding:6px 10px;background:linear-gradient(180deg,#ffe58a,#ffbe2e);color:#3a2400;font:400 15px var(--display);box-shadow:0 3px 0 #b97f0c;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.buy.gemb{background:linear-gradient(180deg,#bff3ff,#56c8f0);color:#06324a;box-shadow:0 3px 0 #2a8ab8}
.buy.off{filter:grayscale(.7) brightness(.8)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #b97f0c}
.btn{min-height:44px;border-radius:14px;padding:8px 14px;background:var(--panel-2);font:400 15px var(--display);box-shadow:0 3px 0 #1a1230}
.btn.pri{background:linear-gradient(180deg,#ff9fd8,#d85aa8);box-shadow:0 3px 0 #8a2a68}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 0}
/* Gear sub tabs, relics, costumes, star items */
.subtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);border-radius:14px;padding:4px;margin-bottom:10px}
.subtabs button{min-height:40px;border-radius:10px;font:400 15px var(--display);color:var(--muted)}
.subtabs button[aria-selected="true"]{background:linear-gradient(180deg,#ffe58a,#ffbe2e);color:#3a2400}
.subtabs.n5{grid-template-columns:repeat(5,minmax(0,1fr))}.subtabs.n5 button{font-size:14px;padding:0 2px}
.subtabs.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.lockrow{opacity:.62}.lockrow .need{color:#ffd84a;font-size:13px}.lockic{font-size:18px}
#buffs{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(214px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;pointer-events:none}
#buffs span{background:rgba(20,12,40,.78);border:1px solid #6a4ad0;border-radius:10px;padding:2px 6px;font:400 12px var(--display);color:#fff;font-variant-numeric:tabular-nums}
.alchhead{display:flex;gap:12px;align-items:center;background:radial-gradient(circle at 15% 50%,#3a5a20,var(--panel) 60%);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.alchhead b{font:400 20px var(--display);color:#bfff8a;display:block}.cauldron{font-size:40px;filter:drop-shadow(0 0 8px #8fff6a)}
.ricon.pt{background:linear-gradient(180deg,#2a4a2a,#142414);box-shadow:inset 0 0 0 2px #8fd86a}
.potion.on{box-shadow:inset 0 0 0 2px #8fff6a,0 0 10px rgba(143,255,106,.25)}.tleft{color:#bfff8a;font-weight:700}
.gstars{font-size:14px;letter-spacing:1px;color:#4a3a2a}.gstars i{font-style:normal}.gstars i.on{color:#ffd84a;text-shadow:0 0 6px #ffb02e}
.bcell .bst{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font:400 11px var(--display);color:#ffd84a;text-shadow:0 1px 2px #000}
.bagbtns .tr small{display:block;font:700 10px var(--body);opacity:.85}.bagbtns .tr{grid-column:span 2}
.runering{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle,#2a1a4a 0 34%,transparent 35%),conic-gradient(from 0deg,#ff6a2b33,#3fb6ff33,#5fe39a33,#c99a5b33,#ffe14a33,#a77bff33,#ff6a2b33);box-shadow:inset 0 0 0 2px #5a3a8a}
.rune{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,var(--rc) -40%,#1a1030 70%);box-shadow:inset 0 0 0 2px var(--rc),0 0 10px var(--rc);transform:rotate(calc(var(--i) * 60deg)) translateY(-104%) rotate(calc(var(--i) * -60deg))}
.rune span{font-size:24px;line-height:1}.rune b{font:400 11px var(--display);color:#fff;text-shadow:0 1px 2px #000}
.rune.sel{box-shadow:inset 0 0 0 3px #fff,0 0 16px var(--rc)}
.rcore{position:absolute;inset:35%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.rcore b{font:400 18px var(--display);color:#e0c8ff}.rcore small,.rcore span{font-size:10px;color:var(--muted)}
.sghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font:400 14px var(--display)}.sghead b{color:#8ff59a}
.sgsets{display:flex;gap:4px}.sgsets .btn{min-width:36px;min-height:34px;padding:0}
.sggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:8px}

.tablewrap{overflow-x:auto;margin-top:8px}
/* Shop */
.notice{background:#3a1d2a;border:1px solid #ff8fa8;color:#ffd0dc;border-radius:12px;padding:8px 12px;font:700 13px var(--body);text-align:center}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.prod{background:var(--panel);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.prod .amt{font:400 20px var(--display);color:var(--gem);display:flex;align-items:center;gap:6px}
.prod .tag{font:700 11px var(--body);background:var(--accent);color:#3a0a2a;border-radius:6px;padding:1px 6px}
.prod .buy{width:100%}
/* Tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#140d28;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:4px;border-top:1px solid #2a2050}
#tabs button{border-radius:12px;padding:8px 0;font:400 13px var(--display);letter-spacing:-.02em;color:var(--muted);min-height:48px}
#tabs button[aria-selected=true]{background:var(--panel-2);color:#fff}
#tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:3px;vertical-align:top}
/* Modals */
.modal{position:fixed;inset:0;background:rgba(8,4,20,.72);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:20}
.modal[hidden]{display:none!important}
.card{background:linear-gradient(180deg,#33255f,#221843);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center}
.card h2{font:400 24px var(--display);margin:0 0 8px}
.card p{margin:6px 0;color:var(--muted);line-height:1.5}
.card .big{font:400 26px var(--display);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px}
.card .btns{margin-top:14px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:rgba(20,12,40,.92);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font:700 14px var(--body);opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* Gacha overlay */
#gachaFx{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 45%,#3a2470,#0b0618 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#gachaFx[hidden]{display:none!important}
.circle{width:180px;height:180px;border-radius:50%;border:3px solid rgba(255,230,140,.8);box-shadow:0 0 40px rgba(255,210,120,.6),inset 0 0 40px rgba(255,210,120,.4);animation:spin 1.2s linear infinite;position:relative}
.circle::before,.circle::after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(190,160,255,.8)}
.circle::after{inset:44px;border-style:solid;border-color:rgba(255,160,220,.7)}
@keyframes spin{to{transform:rotate(360deg)}}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:min(420px,100%);max-height:62vh;overflow-y:auto}
.gcard{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(180deg,#2c2050,#1a1230);border:2px solid var(--gc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:0;transform:translateY(30px) scale(.7);animation:pop .35s forwards;box-shadow:0 0 14px color-mix(in srgb,var(--gc) 60%,transparent)}
.gcard svg{width:58%;height:46%}
.gcard small{font:700 10px var(--body);color:var(--gc)}
@keyframes pop{to{opacity:1;transform:none}}
.reveal{font:400 34px var(--display);text-align:center;animation:pop .4s forwards;opacity:0}
.flashbg{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:26}
.flashbg.go{animation:fl .7s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.circle{animation:none}.gcard,.reveal{animation-duration:.01s}}
/* ===== Round 7: phone readability — Jua for names and numbers, Noto Sans KR for controls and text; gold = do it, cyan = gems ===== */
#app,#sheet{background:var(--ink)}
/* HUD */
#hud{gap:7px}
.hud-row{align-items:flex-start}
.place{flex:1 1 auto;max-width:66%;padding:8px 12px 8px;border-radius:16px;background:rgba(14,9,30,.74);border:1px solid rgba(255,255,255,.09);gap:3px;-webkit-backdrop-filter:blur(6px)}
.place::after{content:none}
.lvline{gap:7px}
#lvTxt{font:400 14px var(--display);color:var(--gold);flex:none}
.lvline .xpbar{min-width:40px;height:5px}
.pmap{flex:none;display:flex;align-items:center;gap:1px;font:700 11px var(--body);color:var(--gold)}
.pmap svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#placeName{font:400 17px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place small{font:700 12px var(--body);color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet{flex:none;flex-direction:column;align-items:flex-end;gap:5px}
.chip{background:rgba(14,9,30,.74);border:1px solid rgba(255,255,255,.09);padding:4px 11px 4px 6px;font-size:15px;-webkit-backdrop-filter:blur(6px)}
#killBar{height:6px;background:rgba(14,9,30,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#retry{background:linear-gradient(180deg,#ffdc66,#ffbf2e);color:var(--gold-ink);box-shadow:0 3px 0 #b07a0a;font:700 15px var(--body)}
/* skill bar */
#skillbar{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));gap:12px}
#tierTag{font-size:15px}
#tierTag small{font:700 12px/1.35 var(--body);color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slots{gap:7px}.sk{width:48px;height:48px;border-radius:15px}
.sk span{font-size:12.5px}
/* tab bar */
#tabs{gap:0;background:linear-gradient(180deg,#1a1338,#0c0820 70%);border-top:0;box-shadow:0 -10px 26px rgba(4,2,14,.55);padding-top:6px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}
#tabs::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 25%,rgba(255,255,255,.22) 75%,transparent)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:53px;padding:2px 0;border-radius:14px;font:700 11px var(--body);letter-spacing:-.02em;color:#8178ad;transition:color .2s}
#tabs svg{width:42px;height:28px;padding:3px 10px;border-radius:999px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .2s,box-shadow .2s}
#tabs [data-tab="more"] svg{fill:currentColor;stroke:none}
#tabs button[aria-selected=true]{background:none;color:#fff}
#tabs button[aria-selected=true] svg{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 3px 12px rgba(255,255,255,.18)}
/* sheet */
#sheet{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));border-top:1px solid #2c2358;box-shadow:0 -14px 34px rgba(0,0,0,.5)}
.sheet-head{padding-top:16px;padding-bottom:8px}
.sheet-head::before{background:#3a2f6a}
.sheet-head b{font-size:21px}
#sheetClose{min-height:38px;min-width:0;padding:0 16px;border-radius:999px;background:var(--panel-2);font:700 14px var(--body);color:var(--text)}
#panel{padding-top:6px;padding-bottom:20px}
#panel h3{font-size:17px;margin:16px 0 10px}
.note{font-size:13px;line-height:1.55}
/* sub tabs: one segmented row that always fits */
.subtabs,.subtabs.n5,.subtabs.n6{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:14px;background:#0e0921;border:1px solid var(--line);margin-bottom:12px}
.subtabs button,.subtabs.n5 button{min-height:38px;padding:0 2px;border-radius:11px;font:700 13.5px var(--body);letter-spacing:-.03em;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 2px 8px rgba(0,0,0,.35)}
/* chips inside a page (gear kind, sigil grade filter) */
.kindtabs{gap:6px;padding:2px 0 8px}
.kindtabs button{min-height:36px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid var(--line);font:700 13.5px var(--body);color:var(--muted)}
.kindtabs button[aria-selected="true"]{background:rgba(255,255,255,.14);border-color:var(--sel);color:#fff}
.kindtabs i{right:3px;top:3px;width:7px;height:7px}
/* buttons: gold = main action, flat violet = other actions, gold outline = currently chosen */
.buy{min-height:44px;border-radius:13px;background:linear-gradient(180deg,#ffdc66,#ffbf2e);color:var(--gold-ink);box-shadow:0 2px 0 #b07a0a;font:700 15px var(--body)}
.buy.gemb{background:linear-gradient(180deg,#c4f4ff,#5fcdf2);color:#05314a;box-shadow:0 2px 0 #2a86b2}
.buy.off,.buy.gemb.off{filter:none;background:#2f2858;color:#9d93c6;box-shadow:none}
.buy:active,.btn:active{transform:translateY(1px)}
.btn{min-height:44px;border-radius:13px;padding:8px 12px;background:var(--panel-2);border:1px solid #42377a;box-shadow:none;font:700 14px var(--body);color:var(--text)}
.btn.pri{background:linear-gradient(180deg,#ffdc66,#ffbf2e);border-color:transparent;color:var(--gold-ink);box-shadow:0 2px 0 #b07a0a}
.btn.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.85);color:#fff}
.btn.off{opacity:.42}
.btns{gap:8px}
/* rows and cards */
.row{background:var(--panel);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px 12px 12px 14px;gap:12px}
.row .name{font-size:16px;line-height:1.25}
.row .desc{font-size:13px;line-height:1.45;margin-top:3px}
.lv{font:700 12px var(--body);color:var(--gold)}
.row .buy{min-width:92px}
.codexbar,.manaline,.tpoints,.shards{background:var(--panel);border:1px solid rgba(255,255,255,.05);font:700 14px var(--body)}
.codexbar b,.manaline b,.tpoints b{font-size:14px}
/* gear bag */
.bagtop{background:var(--panel);border:1px solid rgba(255,255,255,.05);padding:12px;gap:12px}
.binfo{gap:4px}.binfo b{font-size:19px}
.eff{font:700 14px var(--body)}
.eff small,.potbox small{display:block;font:700 11.5px var(--body);color:var(--faint);letter-spacing:.02em;margin-top:3px}
.potbox p{font:700 12.5px var(--body)}
.bagbtns{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0 14px}
.bagbtns [data-blv]{grid-column:span 2;flex-direction:row;gap:8px;font-size:15px}
.bagbtns [data-blv] small{font-size:14px}
.bagbtns .btn{font-size:13px;padding:6px 4px}
.bagbtns .tr{grid-column:span 3;line-height:1.25}
.bagbtns .tr small{font-size:11px;color:var(--muted);margin-top:2px}
.bagacts{margin:4px 0 10px}
.bcell .tg{font:700 11px var(--body);font-style:normal}
.bcell .blv,.bcell .bn{font:700 11px var(--body)}
.gstars{font-size:15px}
/* shop, packs, modals, toast */
.notice{background:rgba(255,143,168,.1);border-color:rgba(255,143,168,.5);font-size:13px}
.prod{border:1px solid rgba(255,255,255,.05)}
.card{background:linear-gradient(180deg,#2c2257,#1b1438);border-color:#40357a}
.card p{font-size:14px;color:var(--muted)}
#toast{bottom:calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px));font-size:14px}
.sbtns .btn{font-size:13px}
/* ===== Round 7d: calm palette ===== */
#app,#sheet{background:var(--ink)}
#sheet{border-top:1px solid rgba(255,255,255,.07);box-shadow:0 -14px 34px rgba(0,0,0,.55)}
.sheet-head::before{background:rgba(255,255,255,.18)}
#sheetClose{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.place,.chip{background:rgba(12,13,22,.72);border-color:rgba(255,255,255,.1)}
#tabs{background:linear-gradient(180deg,#151726,#0b0c14 70%)}
#tabs button{color:#7d809e}
.subtabs,.subtabs.n5,.subtabs.n6{background:#0a0b12;border-color:rgba(255,255,255,.08)}
.subtabs button,.subtabs.n5 button{color:var(--muted)}
.kindtabs button{border-color:rgba(255,255,255,.12)}
.row,.bagtop,.prod,.codexbar,.manaline,.tpoints,.shards{background:var(--panel);border:1px solid rgba(255,255,255,.06)}
.row .lv,.lv{display:inline-block;font:700 11px var(--body);color:#cfd1e6;background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* price buttons: soft gold tint, no heavy block */
.buy{background:linear-gradient(180deg,rgba(255,215,110,.2),rgba(255,215,110,.1));border:1px solid rgba(255,215,110,.55);color:var(--gold-soft);box-shadow:none;font:700 15px var(--body)}
.buy.gemb{background:linear-gradient(180deg,rgba(143,228,255,.2),rgba(143,228,255,.1));border-color:rgba(143,228,255,.55);color:var(--gem-soft);box-shadow:none}
.buy.off,.buy.gemb.off{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:#6b6e88;box-shadow:none}
.buy.off .coin,.buy.off .gem{filter:grayscale(.6) brightness(.8)}
.buy:active{background:rgba(255,215,110,.28)}
/* other buttons: quiet glass; main confirm = white */
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.btn.pri{background:var(--sel-grad);border-color:transparent;color:var(--sel-ink);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.btn.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.85);color:#fff}
#retry{background:var(--sel-grad);color:var(--sel-ink);box-shadow:0 3px 12px rgba(0,0,0,.4)}
.card{background:linear-gradient(180deg,#1f2234,#151726);border-color:rgba(255,255,255,.1)}
.notice{background:rgba(255,120,150,.08);border-color:rgba(255,140,165,.4);color:#ffd2dc}
.pack{background:linear-gradient(120deg,#23263b,var(--panel) 70%);box-shadow:inset 0 0 0 1px rgba(255,215,110,.35)}
.pull{background:linear-gradient(160deg,#262a42,#181a2a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pull.big{background:linear-gradient(160deg,#3a2d4f,#1d1a2c);box-shadow:inset 0 0 0 1px rgba(255,215,110,.35)}
.gacha-head,.alchhead,.rankbox,.tinfo,.ttree{background:var(--panel);border:1px solid rgba(255,255,255,.06)}
.ttree{background:radial-gradient(circle at 50% 40%,#22263c,var(--panel))}
.tnode{background:linear-gradient(160deg,#262a42,#1a1c2c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.slotpick{background:var(--panel);border-color:rgba(255,255,255,.1)}
.srow,.dsel{background:var(--panel)}
.rchip{background:var(--panel-2)}
.rchip.on{background:var(--sel-grad);color:var(--sel-ink);box-shadow:none}
.eslot,.item{background:var(--panel)}
#toast{background:rgba(16,17,28,.94);border-color:rgba(255,255,255,.12)}
.slotout{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.dung{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.dung.dg-gold{box-shadow:inset 0 0 0 1px rgba(255,200,90,.45)}.dung.dg-mana{box-shadow:inset 0 0 0 1px rgba(110,170,255,.45)}.dung.dg-gem{box-shadow:inset 0 0 0 1px rgba(90,220,235,.45)}.dung.dg-rune{box-shadow:inset 0 0 0 1px rgba(180,140,255,.45)}
.bcell .gimg{width:70%;height:70%}.bcell.big .gimg{width:74%;height:74%}.eslot .gimg{width:64%;height:64%}.gcard .gimg{width:62%;height:50%}
/* ---------- drawn pictures (js/icons.js): skills, runes, sigils, gear grades, currencies ---------- */
.ico{display:block;width:100%;height:100%;overflow:visible}
.icur{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.buy .icur{width:1.05em;height:1.05em}
.ico .orb{transform-box:view-box;transform-origin:32px 32px;animation:spin 9s linear infinite}.ico .orb.rev{animation-duration:6s;animation-direction:reverse}
/* skills: a dark tile tinted with the spell colour, the spell's shape on top (no names) */
.sk{width:54px;height:54px;border-radius:17px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c,#888) 46%,#1b1430),#120d20 82%);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c,#888) 70%,#000),inset 0 -5px 0 rgba(0,0,0,.28),0 3px 0 rgba(0,0,0,.35);padding:5px!important;flex:none}
.sk .ico{filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.sk.empty{background:#1c1e30;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}.sk.empty b{position:static;background:none;box-shadow:none;color:var(--faint);font:400 18px var(--display)}
.sk.now{transform:translateY(-5px) scale(1.1);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--c),0 0 18px var(--c)}
.sk.now .ico{animation:skbob .5s ease-in-out infinite alternate}
@keyframes skbob{to{transform:scale(1.1) rotate(-4deg)}}
.sk b{top:-7px;right:-7px;min-width:20px;width:auto;height:20px;padding:0 4px;border-radius:10px;background:#0f1019;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c,#888) 80%,#fff);font:700 10.5px var(--body)}
.slots{gap:9px}
.skrow .sk{padding:6px!important}
.slotpick{min-height:84px;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c,#3a2d63) 70%,#000)}
.spi{width:44px;height:44px;display:grid;place-items:center}.spi.none{font:400 26px var(--display);color:var(--faint);border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
/* runes: carved stones on a ring; lines of power run from the core to every awakened stone */
.runering{background:radial-gradient(circle,#231a3c 0 30%,#16122a 31% 66%,transparent 67%);box-shadow:none;width:300px;max-width:none}
.rlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rlines .flow{stroke-dasharray:5 6;animation:rflow 1.1s linear infinite}
@keyframes rflow{to{stroke-dashoffset:-22}}
.rune{transform:rotate(calc(var(--i) * 60deg)) translateY(-104px) rotate(calc(var(--i) * -60deg));width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:0;background:none;box-shadow:none!important;padding:0;transition:filter .15s}
.rune .ico{width:60px;height:60px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.rune .glyph,.ricon .glyph{filter:drop-shadow(0 0 2.5px currentColor)}
.rune.zero .ico{filter:grayscale(.9) brightness(.6)}
.rune b{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#0f1019;border-radius:8px;padding:0 6px;font:700 10.5px var(--body);white-space:nowrap;box-shadow:0 0 0 1.5px var(--rc)}
.rune .rgn{top:-9px;z-index:1}
.rune.sel .ico{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px var(--rc));transform:scale(1.1)}
.rune.up .ico{animation:runeup .34s ease-out}
@keyframes runeup{0%{transform:scale(1.42);filter:brightness(2.3) drop-shadow(0 0 16px var(--rc))}100%{transform:scale(1.1)}}
.rcore{border-radius:50%;inset:35.5%;background:radial-gradient(circle,#3a2a66,#1a1230);box-shadow:inset 0 0 0 2px #6a55b0}
.rcore.lit{box-shadow:inset 0 0 0 2px #cdb8ff,0 0 18px #9a7bff;animation:corep 2.2s ease-in-out infinite}
@keyframes corep{50%{box-shadow:inset 0 0 0 2px #fff,0 0 30px #b79bff}}
.row>.ricon{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:16px;font-size:26px}
.ricon .irune{width:88%;height:88%}
.sglv>span{display:block}.sglv>span small{display:block}.sglv .buy span{display:inline-flex;flex-direction:row;align-items:center;gap:3px}
/* sigils (신성력): holy gems — the cut shows the grade, the mark shows the stat, the dots show the quality */
.sgcell{border-radius:16px;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--gc,#555) 34%,transparent),rgba(20,16,36,.9) 72%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gc,#555) 55%,transparent);padding:4px}
.sgcell .ico{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.sgcell .isg.b3,.sgcell .isg.b4,.sgbig .isg.b3,.sgbig .isg.b4{animation:sgfloat 2.4s ease-in-out infinite}
@keyframes sgfloat{50%{transform:translateY(-2px);filter:drop-shadow(0 0 7px var(--gc))}}
.sgcell .q{bottom:-6px;font:700 8.5px var(--body);background:#0f1019;box-shadow:0 0 0 1px color-mix(in srgb,var(--gc,#555) 70%,transparent)}
.sgcell .tg{left:1px;top:-5px;z-index:1}
.sgcell.sel{box-shadow:inset 0 0 0 2.5px #fff,0 0 12px var(--gc)}

#hud .place.stg{width:min(270px,70%);padding:7px 12px 9px;gap:6px 8px;background:linear-gradient(180deg,rgba(28,24,52,.78),rgba(12,13,22,.72))}
#hud .stg #placeName{font-size:17px}
#hud .stg #killBar{height:14px}
#hud .stg #placeSub{margin-top:-20px;font:700 10.5px/14px var(--body)}
#bossbox{width:min(270px,70%);padding:7px 12px 9px}#bossbox .bar{height:14px}
#quick{top:calc(150px + env(safe-area-inset-top,0px));gap:8px;right:max(8px,env(safe-area-inset-right,0px))}

/* ==THEME-START== */
/* One look for everything: night-sky blue panels, a thick dark outline on every card and button (the same sticker
   outline as the pictures), fat rounded numbers and titles, and one spacing scale (16 side margin, 10 between cards). */
:root{
  --ink:#141a35; --panel:#232c58; --panel-2:#2e3970; --line:#3b4785; --text:#fffaf0; --muted:#b9c1ea; --faint:#8c95c6;
  --gold:#ffd24a; --gold-soft:#ffe38a; --gold-ink:#4a2c00; --ok:#5fe3a8; --ol:#0c1024; --m:16px;
  --impact:'Bagel Fat One','Jua','Noto Sans KR',system-ui,sans-serif;
  --card:linear-gradient(180deg,#2b3568,#222b56);
  --cut:0 0 0 2px var(--ol),0 4px 0 var(--ol);
}
html,body{background:var(--ink);color:var(--text)}
#app{background:var(--ink)}
/* ----- battle ----- */
#hud{padding:12px var(--m) 0;gap:10px}
.prof,.chip,#quest,#quick button,#pre button{background:rgba(22,28,60,.86);box-shadow:0 0 0 2px var(--ol),inset 0 1.5px 0 rgba(255,255,255,.16);border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.prof{padding:4px 16px 4px 4px;gap:9px}
.ava{width:46px;height:46px;box-shadow:0 0 0 2px var(--gold),0 0 0 4px var(--ol)}
#lvTxt{font:400 15px var(--impact);color:var(--gold);letter-spacing:.01em}
#nick{font:400 15px var(--display);color:#fff}
#tierTag{font:700 11px var(--body);color:var(--muted)}
.prof .xpbar{width:118px;height:6px;background:rgba(255,255,255,.16);margin-top:1px}
.wallet{gap:7px}
.chip{min-width:98px;padding:4px 12px 4px 6px;font:400 15px var(--display)}
#hud .place.stg{width:min(264px,70%);padding:8px 12px 10px;gap:6px 8px;border-radius:16px;background:linear-gradient(180deg,rgba(36,44,92,.9),rgba(20,26,56,.88));box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px rgba(255,210,74,.55),0 4px 0 rgba(12,16,36,.6)}
#hud .stg #placeName{font:400 17px/1.1 var(--impact);color:#fff0b8;text-shadow:0 2px 0 var(--ol)}
#hud .stg .pmap{background:rgba(255,210,74,.2);color:var(--gold);font:400 12px var(--display);padding:3px 8px 3px 10px}
#hud .stg #killBar,#bossbox .bar{height:14px;border-radius:8px;background:#0a0e22;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
#hud .stg #placeSub{margin-top:-20px;font:700 10.5px/14px var(--body)}
#bossbox{width:min(264px,70%);padding:8px 12px 10px;border-radius:16px;gap:6px;background:linear-gradient(180deg,rgba(96,22,48,.94),rgba(48,12,28,.92));box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px rgba(255,120,140,.75),0 4px 0 rgba(12,16,36,.6)}
.boss-top{font:400 15px var(--display)}#bossName{font-family:var(--impact)}
#retry{font:400 17px var(--impact);box-shadow:0 0 0 2px var(--ol),0 5px 0 var(--ol),0 0 18px rgba(255,90,70,.6)}
#quick{right:var(--m);top:calc(146px + env(safe-area-inset-top,0px));gap:9px}
#quick button{width:50px;padding:6px 0 4px;border-radius:15px}
#quick i,#quick i .ico{width:27px;height:27px}
#quick span{font:400 11px var(--display);text-shadow:none}
#buffs{left:var(--m)}
#skillbar{padding:28px var(--m) 12px;gap:11px;background:linear-gradient(180deg,rgba(14,18,40,0),rgba(14,18,40,.78) 58%)}
#quest{padding:4px 14px 4px 5px;font:400 13px var(--display)}
#quest b{font:400 12px var(--display);padding:2px 9px}
#pre{gap:7px}#pre button{width:34px;height:30px;border-radius:10px;font:400 15px var(--display);color:var(--muted)}
#pre button[aria-pressed=true]{background:linear-gradient(180deg,#ffe38a,#ffc22e);color:var(--gold-ink);box-shadow:0 0 0 2px var(--ol),inset 0 2px 0 rgba(255,255,255,.5)}
#slots{gap:14px}
#slots .sk{width:64px;height:64px;border-radius:19px;padding:7px!important;box-shadow:0 0 0 2.5px var(--ol),inset 0 0 0 2.5px color-mix(in srgb,var(--c,#888) 78%,#fff),inset 0 -6px 0 rgba(0,0,0,.3),0 5px 0 var(--ol)}
#slots .sk.now{box-shadow:0 0 0 2.5px var(--ol),inset 0 0 0 3px #fff,0 5px 0 var(--ol),0 0 20px var(--c)}
.sk b{background:var(--ol);box-shadow:0 0 0 2px color-mix(in srgb,var(--c,#888) 75%,#fff);font:400 12px var(--display)}
#gainlog{left:var(--m);font:400 13px var(--display);text-shadow:0 1px 0 var(--ol),0 0 4px var(--ol)}
.coin.fly{z-index:4}
.dmg{font-family:var(--impact);letter-spacing:.01em}
#banner,.reveal{font-family:var(--impact)}
#tabs{background:linear-gradient(180deg,#1a2148,#0f1330);box-shadow:0 -2px 0 var(--ol),0 -10px 24px rgba(4,6,20,.5);padding-left:8px;padding-right:8px}
#tabs::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.2) 20%,rgba(255,255,255,.2) 80%,transparent)}
#tabs button{font:400 12px var(--display);color:var(--muted);letter-spacing:0}
#tabs button[aria-selected=true]{color:var(--gold)}
/* ----- menus ----- */
#sheet{background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/24px 24px,linear-gradient(180deg,#1e2755,#141a35 46%);border:0;border-radius:26px 26px 0 0;box-shadow:0 -3px 0 var(--ol),0 -14px 30px rgba(4,6,20,.55),inset 0 2px 0 rgba(255,255,255,.14)}
.sheet-head{padding:22px var(--m) 12px}
.sheet-head::before{top:9px;background:rgba(255,255,255,.22)}
.sheet-head b{font:400 23px var(--impact);gap:9px;text-shadow:0 2px 0 var(--ol)}
.sheet-head b .ico{width:30px;height:30px}
#sheetClose{min-height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--panel-2);box-shadow:var(--cut);font:400 14px var(--display);color:#fff}
#panel{padding:8px var(--m) 30px}
#panel h3{font:400 19px var(--impact);margin:24px 0 12px;gap:8px;text-shadow:0 2px 0 var(--ol)}
#panel h3::before{width:6px;height:19px;border-radius:3px;background:linear-gradient(180deg,#ffe38a,#ffb92e)}
#panel h3:first-child,#panel .subtabs+h3,#panel .jump+h3{margin-top:6px}
.note{font:400 12px/1.55 var(--body);color:var(--faint)}
.subtabs{background:#0e1330;box-shadow:0 0 0 2px var(--ol),inset 0 2px 0 rgba(0,0,0,.3);border-radius:16px;padding:5px;gap:4px;margin-bottom:16px}
.subtabs button,.subtabs.n5 button{min-height:40px;border-radius:12px;font:400 15px var(--display);color:var(--muted);letter-spacing:0}
.subtabs.n6 button{font-size:14px}
.subtabs button[aria-selected="true"]{background:linear-gradient(180deg,#ffffff,#e4e8ff);color:#1b2352;box-shadow:0 3px 0 #7c86ba}
.kindtabs{gap:8px;padding:4px 2px 12px}
.kindtabs button,.jump button,.rchip{min-height:36px;padding:0 15px;border-radius:999px;border:0;background:var(--panel-2);box-shadow:var(--cut);font:400 14px var(--display);color:var(--muted)}
.kindtabs button[aria-selected="true"]{background:linear-gradient(180deg,#ffffff,#e4e8ff);color:#1b2352;border:0}
.jump{padding:8px 2px 14px;gap:9px;background:linear-gradient(180deg,#1b2350 78%,transparent)}
.jump button{color:#fff;padding:0 15px}
.jump button[aria-selected="true"]{background:linear-gradient(180deg,#ffffff,#e4e8ff);color:#1b2352;box-shadow:0 3px 0 #7c86ba}
/* cards */
.row,.bagtop,.prod,.codexbar,.manaline,.tpoints,.shards,.dung,.pack,.tinfo,.dsel,.alchhead,.srow,.sglv,.gacha-head,.rankbox,.potbox.sgeff{background:var(--card);border:0;border-radius:18px;box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.1)}
.list,.packs,.slist,.dlist{display:flex;flex-direction:column;gap:12px}
.row{padding:12px;gap:12px;min-height:72px}
.row .name,.pack .name,.dung .dname{font:400 16px var(--display);color:#fff}
.dung .dname{font-size:17px;color:var(--gold-soft)}
.row .desc,.pack .desc{font:400 12.5px/1.5 var(--body);color:var(--muted);margin-top:3px}
.row .lv,.lv{font:400 11px var(--display);color:#fff;background:rgba(255,255,255,.14);border-radius:7px;padding:2px 7px;margin-left:7px;vertical-align:1px}
.row>.ricon,.dung .dicon,.pack .picon,.relic .ricon,.ricon.pt,.ricon.mk{width:54px;height:54px;flex:none;border-radius:15px;background:radial-gradient(circle at 50% 28%,#3a478c,#171d44);box-shadow:0 0 0 2px var(--ol),inset 0 2px 0 rgba(255,255,255,.14)}
.relic.divine .ricon{background:radial-gradient(circle at 50% 28%,#8a6a14,#2a1e04);box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px var(--gold)}
.row.lockrow{opacity:.6}
.codexbar,.manaline,.tpoints,.shards{padding:12px 14px;margin-bottom:14px;font:400 15px var(--display)}
.codexbar b,.manaline b,.tpoints b,.shards b{font:400 15px var(--display)}
.dung{padding:12px;gap:12px}.dung.dg-gold,.dung.dg-mana,.dung.dg-gem,.dung.dg-rune{box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.1)}
.dbtns{gap:8px}.dbtns .buy,.dbtns .btn{min-width:76px;min-height:40px}
.pack{padding:12px;gap:12px}
.notice{background:rgba(255,143,168,.12);border:0;box-shadow:0 0 0 2px rgba(255,143,168,.5);border-radius:14px;font:400 13px var(--display);color:#ffd9e2;padding:10px 12px;margin-bottom:12px}
/* buttons */
.buy,.btn,.pull,.slotout{transition:transform .06s}
.buy{min-height:46px;border-radius:14px;border:0;padding:6px 12px;background:linear-gradient(180deg,#ffe98f,#ffc02e);color:var(--gold-ink);font:400 16px var(--display);box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(176,104,0,.3)}
.buy small{font:400 12px var(--display);opacity:.85}
.buy:active,.btn:active,.pull:active,.slotout:active{transform:translateY(3px);box-shadow:0 0 0 2px var(--ol),0 1px 0 var(--ol)}
.buy.gemb{background:linear-gradient(180deg,#b4f0ff,#52b8ff);color:#06304d;box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(20,90,170,.3)}
.buy.off,.buy.gemb.off{background:#39426f;color:#8f98c8;border:0;box-shadow:var(--cut)}
.row .buy{min-width:100px}
.btn{min-height:44px;border-radius:14px;border:0;padding:8px 14px;background:linear-gradient(180deg,#5665c4,#4350a6);color:#fff;font:400 15px var(--display);box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.2)}
.btn.pri{background:linear-gradient(180deg,#9df7cd,#3fd392);color:#07402a;box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.on{background:linear-gradient(180deg,#ffe98f,#ffc02e);color:var(--gold-ink);box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.off,.btn:disabled{opacity:.5}
.btns{gap:10px}
.mulpick{gap:8px;margin:0 0 8px}.mulpick .btn{min-width:60px;min-height:40px}
.pulls{gap:12px;margin-top:14px}
.pull{border-radius:18px;padding:14px;min-height:92px;background:var(--card);box-shadow:var(--cut),inset 0 0 0 2px rgba(127,216,255,.4)}
.pull b{font:400 18px var(--impact);color:#fff}
.pull.off{filter:grayscale(.6) brightness(.8)}
/* skill menu */
.slotgrid{gap:10px}
.slotcard{gap:8px}
.slotpick{min-height:96px;padding:8px 4px 16px;gap:4px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.1),inset 0 -7px 0 color-mix(in srgb,var(--c,#3b4785) 80%,#000)}
.slotpick small{font:400 12px var(--display);color:var(--muted)}
.slotpick em{font:400 12px var(--display);color:var(--gold)}
.spi{width:42px;height:42px}
.slotcard.on .slotpick{border:0;box-shadow:0 0 0 2px var(--ol),0 0 0 4px var(--gold),0 4px 0 var(--ol),inset 0 -7px 0 color-mix(in srgb,var(--c,#3b4785) 80%,#000)}
.slotout{min-height:34px;border-radius:11px;border:0;background:var(--panel-2);box-shadow:var(--cut);font:400 13px var(--display);color:var(--muted)}
.presets{gap:9px;margin:16px 0 12px}.presets .note{font:400 14px var(--display);color:var(--muted)}.presets .btn{min-width:46px;min-height:38px;padding:0}
.skrow{align-items:flex-start}
.skrow .sk{width:54px!important;height:54px!important;border-radius:15px;box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px color-mix(in srgb,var(--c,#888) 75%,#fff)}
.skbtns{gap:8px;margin-top:10px}
.skbtns .btn,.skbtns .buy{min-height:40px;padding:6px 13px;font-size:14px}
/* gear */
.bagtop{padding:14px;gap:14px;margin-bottom:12px}
.bagbtns{gap:9px;margin:0 0 14px}
.bagbtns .buy,.bagbtns .btn{min-height:46px;font-size:14px;white-space:nowrap}
.bagbtns .buy span{white-space:nowrap}
.bgrid{gap:10px}
.bcell{border-radius:14px;box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px var(--gc)}
.bcell.sel{box-shadow:0 0 0 2px var(--ol),inset 0 0 0 3px #fff,0 0 12px rgba(255,255,255,.4)}.bcell.eq{box-shadow:0 0 0 2px var(--ol),inset 0 0 0 3px var(--gold)}
.bcell .tg,.bcell .blv,.bcell .bn{font:400 11px var(--display)}
.cgrid{gap:12px}
.ccard,.dcard{background:var(--card);border-radius:18px;padding:12px;gap:6px;box-shadow:var(--cut),inset 0 0 0 2px var(--gc,rgba(255,210,74,.6))}
.ccard.on{box-shadow:0 0 0 2px var(--ol),0 0 0 4px var(--gold),0 4px 0 var(--ol)}
.ccard b,.dname{font:400 17px var(--display);color:#fff}.dname{color:var(--gold-soft);font-size:18px}
.dcard{margin-bottom:12px;padding:14px}
.dcard .btns{gap:10px;margin-top:10px}
.sghead{margin-bottom:12px;font:400 15px var(--display)}
.sgsets{gap:7px}.sgsets .btn{min-width:38px;min-height:36px}
.sggrid{gap:9px;margin-bottom:14px}.sggrid.inv{gap:18px 10px;padding:8px 2px}
.sglv{padding:12px 14px;margin-bottom:14px}
.potbox.sgeff{padding:12px 14px;margin-bottom:14px}
.sgsel{background:var(--card);border-radius:18px;padding:14px;gap:10px;margin-bottom:14px;box-shadow:var(--cut),inset 0 0 0 2px var(--gc)}
.sgbtns{gap:8px}.sgbtns .btn{min-height:40px;font-size:13px;padding:0 4px}
.bagacts{margin-bottom:14px}
.runering{margin:16px auto 20px}
/* training extras */
.tnode{background:var(--card);box-shadow:var(--cut),inset 0 2px 0 rgba(255,255,255,.1);border-radius:16px}
.tnode.sel{box-shadow:0 0 0 2px var(--ol),0 0 0 4px var(--gold),0 4px 0 var(--ol)}
.tnode b{font:400 15px var(--display)}
.tinfo{padding:14px;gap:6px}
.alchhead{padding:14px;gap:12px;margin-bottom:12px}
/* stage list */
.srow{min-height:60px;padding:8px 12px;gap:8px;border-radius:15px}
.srow.here{box-shadow:0 0 0 2px var(--ol),0 0 0 4px var(--gold),0 4px 0 var(--ol)}
.dsel{padding:8px;margin-bottom:12px}
/* shop */
.shop{gap:12px}.prod{padding:14px;gap:8px}
.prod .amt{font:400 21px var(--impact)}
/* pop-ups */
.card{background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/24px 24px,linear-gradient(180deg,#26306a,#171d42);border:0;border-radius:24px;padding:22px 18px 18px;box-shadow:0 0 0 3px var(--ol),0 8px 0 var(--ol),inset 0 2px 0 rgba(255,255,255,.16)}
.card h2{font:400 24px var(--impact);margin:0 0 10px;text-shadow:0 2px 0 var(--ol)}
.card .big{font-family:var(--impact)}
#toast{background:#1b2350;border:0;box-shadow:0 0 0 2px var(--ol),0 4px 0 var(--ol);border-radius:16px;font:400 14px var(--display)}
/* every menu opens to the same height, starting right under the stage plate */
#sheet,#sheet.tall{height:calc(100% - var(--tabh) - 146px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-height:none}
.bcell.none{filter:grayscale(.75) brightness(.72)}
.jump{top:-8px;margin-top:-8px;padding-top:14px;background:linear-gradient(180deg,#1c2452 82%,rgba(28,36,82,0))}
.rsel{gap:6px}.rchip{min-width:32px;padding:0 6px}
.gcard{background:var(--card);border:0;box-shadow:0 0 0 2px var(--ol),inset 0 0 0 2px var(--gc),0 0 14px color-mix(in srgb,var(--gc) 55%,transparent)}
.gcard small{font:400 11px var(--display)}
.rchip{min-height:0;min-width:0;padding:0;border-radius:50%;font-size:14px;box-shadow:0 0 0 2px var(--ol)}
.rchip.on{background:linear-gradient(180deg,#ffffff,#e4e8ff);color:#1b2352;box-shadow:0 0 0 2px var(--ol),0 0 0 4px var(--gold)}
#gachaFx{background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/24px 24px,radial-gradient(circle at 50% 38%,#2c3c86,#0c1024 75%)}
/* one vertical rhythm inside every menu: 12 between blocks, 24 before a section title, 6 between two notes */
#panel{display:flex;flex-direction:column;gap:12px;padding-top:2px;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
#panel>*{flex:none;margin-top:0!important;margin-bottom:0!important}
#panel>h3{margin-top:12px!important}
#panel>h3:first-child,#panel>.subtabs+h3,#panel>.jump+h3{margin-top:0!important}
#panel>.note+.note{margin-top:-6px!important}
#panel>.kindtabs{padding:2px 2px 6px;margin-bottom:-6px!important}
#panel>.jump{top:-2px;margin-top:-2px!important;margin-bottom:-6px!important;padding:8px 2px 12px}
.sheet-head{padding-bottom:14px}
/* battle: shortcuts start one step below the stage plate, potion timers sit on the left at the same height */
#hud .place.stg,#bossbox{width:min(246px,64%)}
#quick{top:calc(160px + env(safe-area-inset-top,0px))}
#buffs{top:calc(160px + env(safe-area-inset-top,0px));left:var(--m);flex-direction:column;gap:6px;align-items:flex-start}
#buffs span{background:rgba(22,28,60,.86);border:0;box-shadow:0 0 0 2px var(--ol);border-radius:10px;padding:3px 8px;font:400 12px var(--display)}
/* stage plate: gold outlined place name, a number badge, and a chunky hunt bar with the count inside and the boss waiting at its end */
#hud .place.stg{width:min(262px,70%);padding:10px 12px 12px;gap:9px 8px;overflow:visible}
#hud .stg #placeName{display:flex;align-items:center;gap:7px;min-width:0;overflow:visible;font:400 19px/1.05 var(--impact);text-shadow:none}
#placeName b{position:relative;font-weight:400;white-space:nowrap;letter-spacing:.01em;color:#ffcf4a;-webkit-text-stroke:4px var(--ol);paint-order:stroke fill}
#placeName b::after{content:attr(data-t);position:absolute;left:0;top:0;-webkit-text-stroke:0;background:linear-gradient(180deg,#fffce6 16%,#ffe27a 50%,#ffa62b 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
#placeName i{flex:none;font:400 14px/1 var(--impact);font-style:normal;color:var(--gold-ink);background:linear-gradient(180deg,#fff3b0,#ffc22e);border-radius:999px;padding:4px 9px 3px;box-shadow:0 0 0 2px var(--ol),inset 0 -2px 0 rgba(160,90,0,.35),inset 0 1.5px 0 rgba(255,255,255,.7)}
#placeName u{position:absolute;left:12px;top:-10px;text-decoration:none;font:400 11px/1 var(--display);color:#fff;background:linear-gradient(180deg,#ff8fa8,#e2456b);border-radius:999px;padding:3px 9px 2px;box-shadow:0 0 0 2px var(--ol)}
#hud .stg #killBar{height:20px;border-radius:11px;background:#080b1c;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 3px 0 rgba(0,0,0,.45)}
#hud .stg #killBar i{position:relative;border-radius:11px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.2) 0 7px,rgba(255,255,255,0) 7px 14px),linear-gradient(180deg,#b9ff8a,#3fd07a 60%,#22a862);background-size:28px 100%,auto;box-shadow:inset 0 2.5px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,70,40,.35),0 0 10px rgba(90,240,150,.55);animation:barflow 1.1s linear infinite;transition:width .25s cubic-bezier(.2,.9,.3,1.2)}

   tapped picture moves once in its own way (칼은 부딪치고, 화살표는 올라가고, 책은 흔들리고, 가방은 통통, 선물은 덜컹,

#tabs{background:linear-gradient(180deg,#fbfbfd 0%,#f1eff8 60%,#ebe8f5 100%);box-shadow:0 -1px 0 #dfe3ee,0 -8px 22px rgba(70,70,130,.2);overflow:hidden}

/* the design's screen made the whole app screen: fixed over the game, scrolls on short phones, fades out on 모험 시작 */
#cwUpdate{position:fixed;inset:0;z-index:2000;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#0f1019;transition:opacity .45s}
#cwUpdate.leave{opacity:0;pointer-events:none}
#cwUpdate .game-screen{max-width:560px;margin:0 auto;min-height:100%;border-radius:0;box-shadow:none;padding-bottom:calc(46px + env(safe-area-inset-bottom,0px))}
#cwUpdate .game-heading{padding-top:env(safe-area-inset-top,0px)}
#cwUpdate .game-action{font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.04em;padding:14px}
/* 안내 문구 디자인 A안 (2026-11-15) → 같은 날 사용자: 보라 말고 블랙, 블랙엔 흰 글씨, 전부 다. ui.js modal(...,{variant:'guide'|'danger'}) · guideRow · .skinfo · 뽑기 머리 칸(.ghd)에만 붙는다. .note/.desc/.card 전체는 건드리지 않음 */
#modalCard.guide-card{--text:#fff;--muted:#b9b6bf;position:relative;background:#18171b;color:#fff;border:1px solid #2e2d33;border-radius:26px;padding:24px;width:min(376px,100%);max-height:calc(100dvh - 40px);overflow:auto;text-align:left;box-shadow:0 18px 48px #00000066}
#modalCard.guide-card h2{font-family:var(--body);font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.035em;color:#fff;margin:0 0 8px;padding-right:28px;text-shadow:none}
#modalCard.guide-card>p{font:400 14px/1.7 var(--body);color:#d6d3dc;text-align:left;margin:0 0 10px;word-break:keep-all;overflow-wrap:anywhere}
#modalCard.guide-card>p b,#modalCard.guide-card>p strong{color:#fff;font-weight:700}
.guide-card .guide-lead{font-size:14px;line-height:1.65;color:#b9b6bf!important;margin:0 0 16px!important}
.guide-card .guide-section{padding:14px 16px;margin:10px 0;background:#26252b;border:1px solid #34333a;border-radius:16px}
.guide-card .guide-section h3{font:700 15px/1.45 var(--body);color:#fff;margin:0 0 5px}
.guide-card .guide-section p{font:400 14px/1.7 var(--body);color:#d6d3dc;text-align:left;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.guide-card .guide-section strong{font-weight:700;color:#fff}
.guide-card .guide-tip{font:400 12px/1.7 var(--body);color:#a9a6b0;background:#222126;border-radius:12px;padding:10px 12px;margin:12px 0 0}
#modalCard.guide-card .btns{display:flex;gap:8px;margin-top:20px}
#modalCard.guide-card .btn{flex:1;min-height:48px;border:1px solid #3a3940;border-radius:14px;background:#2a292f;color:#fff;font:700 15px var(--body);box-shadow:none}
#modalCard.guide-card .btn.pri{background:#fff;color:#141316;border-color:#fff;box-shadow:none}
#modalCard.guide-card.danger .guide-section{background:#3a2025;border-color:#5a2d35}
#modalCard.guide-card.danger .btn.pri{background:#d0566c;border-color:#d0566c;color:#fff}
#modalCard.guide-card .codebox{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #3a3940;background:#222126;color:#fff}
/* 성능 기록 표 (2026-11-17, ui.js showPerf): 한 줄이 1분, 좁은 폰에서는 옆으로 밀어서 봄 */
#modalCard .perftab{margin:0 -14px;max-height:min(52dvh,420px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid #34333a;border-radius:12px;background:#1f1e23}
#modalCard .perftab table{border-collapse:collapse;width:100%;font:600 11.5px/1.3 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;color:#e9e7ee}
#modalCard .perftab th{position:sticky;top:0;background:#2a292f;color:#b9b6bf;font-weight:700;padding:7px 4px;text-align:right}
#modalCard .perftab td{padding:6px 4px;text-align:right;border-top:1px solid #2a292f}
#modalCard .perftab th:first-child,#modalCard .perftab td:first-child{text-align:left}
#modalCard .perftab tr.bad td{background:#3a2025;color:#ffd5dc}
#modalCard.guide-card .nickin{width:100%;box-sizing:border-box;min-height:44px;border-radius:12px;border:1px solid #3a3940;background:#222126;color:#fff;font:500 16px var(--body);padding:0 12px}
#modalCard .guide-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:50%;background:#2a292f;color:#fff;font:400 22px/36px var(--body);padding:0;cursor:pointer}
.guide-summary{display:flex;width:100%;box-sizing:border-box;justify-content:space-between;gap:12px;align-items:center;border:0;border-radius:12px;padding:11px 13px;margin:6px 0 10px;background:#1f1e23;color:#fff;font:500 13px/1.55 var(--body);text-align:left;cursor:pointer}
.guide-summary span{flex:1;min-width:0;word-break:keep-all}
.guide-summary b{flex:none;font:700 12px var(--body);color:#141316;background:#fff;border-radius:999px;padding:4px 10px}
.skinfo{background:#1f1e23;border:0;border-radius:16px;padding:4px 14px;margin:12px 0 6px}
.skinfo>div{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid #34333a}
.skinfo>div:first-child{border-top:0}
.skinfo em{flex:none;width:72px;font:700 13px/1.6 var(--body);font-style:normal;color:#a9a6b0}
.skinfo>div.on em{color:#ff8fa3}
.skinfo p{flex:1;min-width:0;margin:0;font:400 14px/1.6 var(--body);color:#e4e1e8;text-align:left;word-break:keep-all}
.skinfo strong{color:#fff;font-weight:800}
.skinfo small{display:block;margin-top:2px;font:400 12px/1.55 var(--body);color:#a9a6b0}
#panel .gacha-head.ghd{background:#222127;border:0;box-shadow:none;border-radius:22px;padding:20px 22px;gap:18px;align-items:center}
#panel .gacha-head.ghd .lvl{color:#fff;font:800 40px/1 var(--body);min-width:64px;text-align:center}
#panel .gacha-head.ghd .lvl small{display:block;color:#a9a6b0;font:500 12px var(--body);margin-top:10px}
.ghd .ghrows{flex:1;min-width:0}
.ghd .ghrows p{display:flex;align-items:baseline;gap:12px;margin:0;padding:4px 0;font:500 14px/1.5 var(--body);color:#a9a6b0}
.ghd .ghrows p em{font-style:normal;flex:none;width:6.2em}
.ghd .ghrows p b{color:#fff;font:700 14px/1.5 var(--body);text-align:left}
.ghd .ghbar{height:6px;border-radius:6px;background:#3a3940;margin:4px 0 8px;overflow:hidden}
.ghd .ghbar i{display:block;height:100%;min-width:6px;border-radius:6px;background:#d9b8e6}
.ghd .ghbar i{position:relative;overflow:hidden}
.ghd .ghbar i:after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#ffffffaa,transparent);animation:ghshine 2.6s ease-in-out infinite}
.ghd.play .lvl{animation:ghpop .55s cubic-bezier(.3,1.6,.5,1) both}
.ghd.play .lvl small{animation:ghin .4s .15s ease-out both}
.ghd.play .ghrows>*{animation:ghin .45s ease-out both}
.ghd.play .ghrows>:nth-child(1){animation-delay:.08s}.ghd.play .ghrows>:nth-child(2){animation-delay:.14s}.ghd.play .ghrows>:nth-child(3){animation-delay:.2s}.ghd.play .ghrows>:nth-child(4){animation-delay:.26s}.ghd.play .ghrows>:nth-child(5){animation-delay:.32s}.ghd.play .ghrows>:nth-child(6){animation-delay:.38s}
.ghd.play .ghbar i{animation:ghfill 1s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes ghpop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}
@keyframes ghin{from{opacity:0;transform:translateX(12px)}}
@keyframes ghfill{from{width:var(--from,0%)}}
@keyframes ghshine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.ghd *,.ghd *:after{animation:none!important}}
/* 뽑기 레벨 칸, 오팔판 (2026-11-16, the user: 여기도 다르게): pearl card in the opal menus' colours, a glowing level medal
   with a turning opal ring, the bar to the next level, and four small boxes (전설 확정 · 전설 · 신화 · 태초 이상). */
#panel .gacha-head.ghd.gh2{position:relative;overflow:hidden;background:linear-gradient(120deg,#fff 0%,#f6f2ff 45%,#eef8fb 100%);box-shadow:inset 0 0 0 1.5px #dfe3ee,0 4px 12px -6px rgba(70,70,140,.35);border-radius:22px;padding:16px 14px 14px;gap:14px;align-items:center}

#panel .gacha-head.ghd.gh2 .lvn{display:block;color:#2a3150;text-shadow:0 1px 0 #fff}
#panel .gacha-head.ghd.gh2 .lvl small{margin-top:3px;color:#6b5aa8;font:800 10px/1 var(--body)}
#panel .gh2 .ghrows{position:relative;z-index:1}
#panel .gh2 .ghnext{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0;padding:0;font:700 13px/1.3 var(--body);color:#5b6180}

#panel .gh2 .ghnext b{font:400 18px/1 var(--display);color:#1f706c}
#panel .gh2 .ghbar{height:10px;border-radius:10px;background:#e4e6f0;box-shadow:inset 0 1px 2px rgba(60,70,120,.2);margin:7px 0 10px}

#panel .gh2 .ghchips em::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--g)}

/* 뽑기 메뉴 위의 고양이 귀 상자 (2026-11-16, js/ui.js gachaPanel·pullOpen): 크게, 배경 없이 상자만 둥실. 뽑기를 누르면 그 자리에서
   덜컹덜컹(.go) → 딱 열림(.open: 열린 그림, 번쩍, 반짝이가 튀어나옴) → 장비 카드. 전설 이상(.big)은 더 오래 버티고 금빛 */
.gchest{position:relative;display:flex;justify-content:center;margin:0 0 4px;height:min(230px,58vw)}
.gchest::before{content:'';position:absolute;left:50%;bottom:4%;width:62%;height:14%;margin-left:-31%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,206,140,.75),rgba(214,160,110,.25) 60%,transparent);animation:gcglow 2.6s ease-in-out infinite}
.gchest img{position:absolute;top:0;left:50%;height:100%;width:auto;aspect-ratio:1;transform:translateX(-50%);-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(80,50,40,.25))}
.gchest .cclosed{animation:gcfloat 2.6s ease-in-out infinite;transform-origin:50% 88%}
.gchest .copen{opacity:0}
@keyframes gcfloat{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-6px) rotate(-1deg)}}
@keyframes gcglow{0%,100%{opacity:.75;transform:scaleX(1)}50%{opacity:.5;transform:scaleX(.88)}}
.gchest>i{position:absolute;display:block;pointer-events:none;opacity:0}
.gchest .gcflash{left:50%;top:44%;width:120%;max-width:420px;aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,240,200,.95) 22%,rgba(255,220,150,0) 62%);z-index:2}
.gchest .gcsp{left:50%;top:40%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);background:#fff4c4;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px #ffd86a);z-index:3}
.gchest .gcsp.s1{--s:16px;--dx:-120px;--dy:-60px}.gchest .gcsp.s2{--s:20px;--dx:-60px;--dy:-110px}.gchest .gcsp.s3{--s:14px;--dx:0px;--dy:-130px}.gchest .gcsp.s4{--s:20px;--dx:62px;--dy:-108px}
.gchest .gcsp.s5{--s:16px;--dx:122px;--dy:-56px}.gchest .gcsp.s6{--s:11px;--dx:-150px;--dy:10px;background:#e9d6ff}.gchest .gcsp.s7{--s:12px;--dx:150px;--dy:6px;background:#e9d6ff}.gchest .gcsp.s8{--s:10px;--dx:30px;--dy:-80px;background:#bff3ff}
/* pressed */
.gchest.go .cclosed{animation:gcshake .26s ease-in-out infinite}
.gchest.go::before{animation:none;opacity:1;background:radial-gradient(closest-side,rgba(255,226,150,.95),rgba(255,190,110,.35) 60%,transparent)}
@keyframes gcshake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-4deg) translateY(-4px)}75%{transform:translateX(-50%) rotate(4deg) translateY(-4px)}}
.gchest.big.go .cclosed{animation-duration:.2s}
.gchest.open .cclosed{opacity:0;animation:none}
.gchest.open .copen{opacity:1;animation:gcpop .38s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gcpop{0%{transform:translateX(-50%) scale(.9)}50%{transform:translateX(-50%) scale(1.14) translateY(-6px)}100%{transform:translateX(-50%) scale(1.04)}}

   그림(art/mn-neb-fill.webp)이 천천히 흐르고 별이 반짝임, 글씨는 흰색. 고른 탭은 아래 막대 없이 아이콘 뒤 빛이 숨 쉬고 둥실,
   다른 아이콘들도 6초마다 차례로 저마다 한 번씩 움직임(칼 부딪힘·화살표 폴짝·책 기울임·가방 통통·선물 덜컹·문 빛남·더보기 돎). */

  #tabs{left:auto!important;right:var(--er);top:0;bottom:0;width:var(--tw);height:auto;display:grid;grid-template-columns:1fr!important;grid-template-rows:repeat(7,minmax(0,1fr));gap:0!important;padding:calc(var(--st) + 10px) 0 calc(var(--sb) + 4px) 0!important;border-radius:0!important;box-shadow:-1px 0 0 rgba(255,255,255,.35),-8px 0 22px rgba(40,20,100,.35)!important;
